# CodeQL analysis for Anabasis (C++20 / JUCE audio plugin).
#
# Languages analyzed:
#   * c-cpp   -- src/ + tests/ (the only application code in the repo)
#   * actions -- .github/workflows/ (workflow security queries)
#
# c-cpp uses build-mode MANUAL, not "none": JUCE arrives via CMake FetchContent
# at configure time, so the bare checkout contains no framework headers and a
# no-build analysis could resolve almost none of the includes. The manual build
# mirrors the Linux CI steps from build.yml (scripts/setup-linux.sh + Ninja
# Release) but compiles only the VST3 and test targets: the Standalone format
# recompiles the identical translation units and would double extraction time
# for zero extra alert coverage (ANABASIS_BUILD_STANDALONE, default ON).
#
# Alerts are limited to the repository's own code (config paths-ignore: build)
# -- the FetchContent'd JUCE tree lands in build/_deps inside the workspace and
# must not raise alerts we cannot act on; JUCE is pin-locked and review-gated
# per docs/policies/DEPENDENCY_POLICY.md.
#
# Query suite: the default code-scanning suite (precision-tuned). The
# security-extended suite is deliberately not used -- higher false-positive rate
# on a codebase with no untrusted-input surface (audio plugin: no network, no
# file-format parsing beyond JUCE's).
#
# Docs-only changes skip the workflow entirely -- a full compile for a markdown
# edit is pure CI cost.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'worklogs/**'
      - 'packaging/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'worklogs/**'
      - 'packaging/**'
  schedule:
    - cron: '18 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pre-P1 guard -- see .github/workflows/build.yml for the rationale.
  # Becomes a permanent no-op once CMakeLists.txt exists.
  #
  # This must gate the C-CPP entry ONLY: the `actions` entry analyses
  # .github/workflows/**, which exist right now and need no build at all. Gating
  # it too would switch workflow security scanning off for the whole of P0 --
  # exactly the phase in which these workflow files are being written.
  #
  # SCOPE, precisely: both triggers are `branches: [main]`, so a workflow change
  # is analysed on the PR into main and on the post-merge push -- NOT on direct
  # pushes to a feature branch. Nothing reaches main unscanned, which is the
  # property that matters, but the scan is not continuous while a branch is being
  # iterated on. `.github/**` is deliberately absent from paths-ignore, so a
  # workflow-only PR still triggers this analysis.
  #
  # It is done by EMITTING THE MATRIX, not by a condition on the analyze job.
  # `matrix` is not an available context in `jobs.<id>.if` (only `github`,
  # `needs`, `vars`, `inputs` are), so a job-level `matrix.language != 'c-cpp'`
  # test either fails workflow validation or evaluates empty -- in which case the
  # c-cpp entry runs anyway and fails on the missing project, which is the exact
  # red-CI noise this guard exists to prevent. `needs` IS available in
  # `jobs.<id>.strategy`, so a dynamic matrix is the mechanism that actually works.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          ACTIONS='{"language":"actions","build-mode":"none"}'
          CCPP='{"language":"c-cpp","build-mode":"manual"}'
          if [ -f CMakeLists.txt ]; then
            echo "matrix={\"include\":[$ACTIONS,$CCPP]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$ACTIONS]}" >> "$GITHUB_OUTPUT"
            echo "::notice::No CMakeLists.txt yet (pre-P1 scaffold) -- the c-cpp entry is omitted from the matrix; the actions analysis still runs."
          fi

  analyze:
    needs: preflight
    # No job-level `if:` -- the gating lives in the matrix preflight emits (see
    # above). An entry that is not in the matrix simply does not exist, so
    # nothing is skipped and nothing reports red.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      # Built by `preflight`: always the `actions` entry, plus `c-cpp` once
      # CMakeLists.txt exists.
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Alert filter only (extraction still traces the full build): keeps the
          # FetchContent'd JUCE sources under build/_deps out of the results.
          # Harmless for the actions matrix entry -- nothing under .github/ lives
          # in build/.
          # P1 CHECK: this filter is written against the assumption that JUCE
          # lands under build/_deps, which holds only while the configure below
          # uses `-B build` AND CMakeLists.txt leaves FETCHCONTENT_BASE_DIR at its
          # default. If CMakeLists.txt overrides that dir -- or an offline
          # -DANABASIS_JUCE_PATH tree is used instead -- JUCE sources fall outside
          # `build` and every JUCE alert reappears in the results. Re-verify when
          # CMakeLists.txt lands rather than triaging a few thousand alerts.
          config: |
            paths-ignore:
              - build

      # c-cpp only. Same dependency set and configure flags as the Linux job in
      # build.yml; ANABASIS_BUILD_NUMBER is irrelevant to analysis.
      - name: Build for analysis (c-cpp manual build mode)
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-linux.sh
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANABASIS_BUILD_STANDALONE=OFF
          cmake --build build --target Anabasis_VST3 AnabasisTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
