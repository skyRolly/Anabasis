name: Build & Validate

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  # Lets a future release.yml REUSE this exact build+validation matrix on a
  # release tag (single build, same gates, artifacts land in the caller run).
  # Purely additive -- branch/PR/dispatch behaviour is unchanged, and tag
  # pushes still do not trigger THIS workflow (the `branches` filter excludes
  # tag events).
  workflow_call:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# pluginval strictness escalates with the project phase, and lives in ONE place
# so raising the bar is a one-line edit. THIS BLOCK IS THAT PLACE. The two
# documents that describe the gate defer to it and state no number of their
# own: docs/policies/TESTING_POLICY.md owns what the gate REQUIRES (suites,
# modes, passes, platforms) and docs/procedures/CI_CD.md owns how the pipeline
# is WIRED. They pointed at each other for the value for one round, which is
# how the ladder ended up copied into prose twice.
#
# The env var below is the value in force RIGHT NOW, unconditionally, on every
# branch — it is not phase-gated at runtime; the phases are the history of how
# the bar was raised:
#
#     P1-P2 (skeleton, DSP core)      -> 5    development bar
#     P3-P5 (metering, adaptive, UI)  -> 8    standard gate
#     P6 / every release              -> 10   pre-release gold standard,
#                                             REQUIRED (in force since
#                                             2026-08-02)
#
# Lowering it below the current phase's value is a deliberate act that must be
# justified in the PR. This block is cited as the single authority for the
# number, so it carries no duplicate rows: the 2026-08-02 raise briefly added a
# second P6 line that disagreed with the first.
# ---------------------------------------------------------------------------
env:
  ANABASIS_PLUGINVAL_STRICTNESS: 10

# Every push builds the FULL set of formats on all three desktop OSes so beta
# testers can install on any platform:
#   * Linux   -> VST3 + Standalone
#   * Windows -> VST3 + Standalone
#   * macOS   -> VST3 + AU + Standalone  (universal arm64 + x86_64)
#
# Validation is UNIFORM across all three platforms and BLOCKING on each:
# pluginval at the phase strictness, run in two explicit modes -- deterministic
# and randomise -- each repeated 3 consecutive times (scripts/run-pluginval.sh on
# Linux/macOS, scripts/run-pluginval.ps1 on Windows). A non-zero pluginval exit
# fails the job on every platform (no continue-on-error / swallowed exit codes).
# Both mode steps carry the SAME explicit condition, so they report independently:
# a DETERMINISTIC failure never skips randomise, and the job still fails if either
# mode fails. That condition names the steps which must have succeeded for the
# binary to be worth validating -- the build, plus (on LINUX ONLY) the strip, which
# there runs BEFORE validation so the gate sees the exact stripped bytes users
# receive. A failure in either leaves nothing meaningful to validate, and running
# anyway would only add a red step that hides the real cause.
#
# Symbol handling: every platform generates full debug info, retains it as a
# separate *-debug artifact (split .debug / PDB / dSYM) for crash symbolication,
# and ships STRIPPED public binaries.
#
# ASYMMETRY, stated rather than glossed: ONLY LINUX validates the shipped bytes.
# Its strip step runs BEFORE pluginval, so the gate sees exactly what users get.
# On macOS `strip -x` + ad-hoc codesign happen in the packaging step AFTER
# pluginval, and on Windows the public copy is produced after validation too --
# so on those two platforms a defect introduced BY stripping or signing would
# ship unvalidated. Reordering them is not free (macOS must codesign last, or the
# seal breaks), so it is a real design question to settle at P6 when there is a
# binary to measure against, not something to guess at now. Recorded in
# docs/procedures/CI_CD.md and docs/OPEN_QUESTIONS.md (OQ-012).
#
# On macOS the dSYM capture is BEST-EFFORT: under Release+LTO the DWARF needed
# for dSYM reconstruction may no longer exist at packaging time, in which case
# the -debug upload is skipped with a warning while the customer artifacts ship
# normally.
#
# Customer uploads are gated on the self-tests AND their strip/packaging steps
# SUCCEEDING (never `if: always()`), and the staging steps self-validate (no
# symbol table, no debug files in the public copy) -- neither a partial packaging
# failure nor a failed behavioural gate can ship a customer artifact. Developer
# *-debug artifacts and (on pluginval-only failures) beta artifacts remain
# available.

jobs:
  # -------------------------------------------------------------------------
  # Documentation structure lint (scripts/check-docs.py).
  #
  # Runs in the pre-P1 scaffold too -- which is exactly when the documentation
  # IS the deliverable -- so it deliberately does NOT depend on `preflight` or
  # on CMakeLists.txt existing.
  #
  # Deliberately NOT a dependency of the build jobs either: a prose defect
  # should fail the run, not skip a binary that is otherwise fine.
  #
  # `--self-test` runs FIRST and is the load-bearing half. The checker once
  # reported this repository "50 file(s) clean" while an unclosed fence exempted
  # 1382 lines of its largest document from every check, so "the script exited 0"
  # is not evidence unless the script's own guarantees were exercised in the same
  # run. Both commands are plain `python3` invocations with no dependencies
  # beyond the standard library.
  # -------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    # Same rationale as `preflight` below: skip the duplicate same-repo PR event,
    # keep fork PRs (which the push trigger does not reach). Two consequences of
    # sharing that guard, stated here so neither is discovered later:
    #   * On a same-repo PR this job reports as SKIPPED in the PR's checks list.
    #     It can still be made a required status check, but only if the branch
    #     protection accepts a skipped conclusion as passing -- the lint has
    #     already run on the branch push for that same SHA.
    #   * The `workflow_call` hazard documented for `preflight` applies verbatim:
    #     inside a reusable workflow `github.event_name` reflects the CALLER's
    #     event, so a future caller invoked on a same-repo pull_request would skip
    #     this job too. Unlike the build jobs nothing gates on it, so the failure
    #     mode is a missing check rather than a green run with zero builds.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
      - name: Lint documentation structure
        run: |
          python3 scripts/check-docs.py --self-test
          python3 scripts/check-docs.py

  # -------------------------------------------------------------------------
  # Pre-P1 guard. This repository is currently a scaffold: the governance docs,
  # scripts and workflows exist, but there is no CMakeLists.txt and no src/
  # (docs/DEVELOPMENT_BRIEF.md §11 -- the build lands at P1). Without this
  # check every push would report a red build for a project that has not been
  # written yet, which trains everyone to ignore CI.
  #
  # The moment CMakeLists.txt appears this job outputs ready=true and becomes a
  # permanent no-op; it may then be deleted, but does no harm if left.
  # -------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    # Same-repo pull_request events are skipped entirely: `push: ["**"]` already
    # built that exact SHA, so running the 3-OS matrix again on the PR event is a
    # duplicate build per commit for as long as the PR is open. Fork PRs are NOT
    # covered by the push trigger (the push happens in the fork), so they still
    # run -- which is the only case the pull_request trigger uniquely serves here.
    #
    # LATENT HAZARD for `workflow_call` (P6): inside a reusable workflow,
    # `github.event_name` reflects the CALLER's event. A future caller invoked on a
    # same-repo pull_request would therefore skip this job -- and, because every
    # build job gates on `needs.preflight.outputs.ready`, would get ZERO build jobs
    # while still reporting success. The planned caller (release.yml) is
    # tag-push-triggered, so this is latent, not broken. Re-check it when release.yml
    # lands; see docs/procedures/CI_CD.md.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CMakeLists.txt yet (pre-P1 scaffold) -- build and validation jobs are skipped."
          fi

  linux:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-linux.sh

      - name: Configure
        # ANABASIS_BUILD_BENCH is ON here and nowhere else. The bench stays OFF
        # by default (a benchmark that always builds gets run casually and
        # quoted without its machine — the C2 failure PERFORMANCE_BUDGET.md
        # guards against), but OFF everywhere meant `tests/bench.cpp` was
        # compiled by no automated job at all: its DSP calls would rot silently
        # the first time a signature moved, and the rot would only surface when
        # someone re-ran the measurement the budget's refresh rule requires.
        # Building it on ONE platform costs a translation unit and makes the
        # rot a red build. It is still never RUN in CI — timings from a shared
        # runner are exactly the numbers that must not be quoted.
        # TWO residuals, stated so this is not mistaken for full cover.
        # (a) Only THIS platform compiles it, so a signature change behind
        #     `#if JUCE_MAC` or `JUCE_WINDOWS` could still rot the bench.
        # (b) Compiling is not running: a change that KEEPS every signature but
        #     breaks the measurement's semantics — a stage that now needs a
        #     per-sample `tick()`, say — builds green here and only surfaces
        #     when someone re-runs the budget refresh. Cover for that is a human
        #     re-measure, which PERFORMANCE_BUDGET.md already requires; it is
        #     deliberately not a CI job, because the numbers a shared runner
        #     produces are exactly the ones that must not be quoted.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANABASIS_BUILD_BENCH=ON -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + Standalone + tests + bench)
        id: build
        run: cmake --build build --config Release

      # Capture split debug info, then strip the shipped binaries. Runs BEFORE
      # pluginval so the release gate validates the exact stripped bytes users
      # receive. --strip-unneeded keeps .dynsym (the VST3 entry points hosts
      # resolve); the .debug files carry the full symbol/debug info for crash
      # symbolication and ship as a SEPARATE artifact, never inside the public one.
      - name: Extract debug symbols + strip shipped binaries
        id: strip
        run: |
          set -e
          SO="build/Anabasis_artefacts/Release/VST3/Anabasis.vst3/Contents/x86_64-linux/Anabasis.so"
          APP="build/Anabasis_artefacts/Release/Standalone/Anabasis"
          # NEVER MAKE THIS DIR A DESCENDANT OF THE PUBLIC ONE. The invariant is
          # about PATH ANCESTRY, not string prefixes: "dist/Anabasis-Linux" IS a
          # string prefix of "dist/Anabasis-Linux-debug" today and that is fine,
          # because `upload-artifact` treats `path: dist/Anabasis-Linux` as a
          # literal directory and `find "$DIST"` descends only that directory --
          # neither matches by prefix. What would break is a rename to a nested
          # layout (dist/Anabasis-Linux/debug), which puts the .debug files inside
          # the uploaded tree AND inside the leak-checked tree at once: shipped
          # symbols, or a failing leak check, depending on the pattern.
          DBG="dist/Anabasis-Linux-debug"
          mkdir -p "$DBG"
          objcopy --only-keep-debug "$SO"  "$DBG/Anabasis.vst3.so.debug"
          objcopy --only-keep-debug "$APP" "$DBG/Anabasis.standalone.debug"
          strip --strip-unneeded "$SO"
          strip --strip-unneeded "$APP"
          # objcopy stores the debuglink filename EXACTLY as given, and a debugger
          # resolves it relative to the stripped binary's own directory (then
          # .debug/, then the global debug dir). Passing "$DBG/..." would bake in a
          # CI-workspace-relative path that exists on no user's machine, so the
          # downloaded -debug artifact would never be found automatically. Run
          # objcopy from inside $DBG and pass the bare basename, which is the
          # conventional lookup; the binary paths are made absolute first because
          # the working directory changes.
          SO_ABS="$(readlink -f "$SO")"; APP_ABS="$(readlink -f "$APP")"
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anabasis.vst3.so.debug    "$SO_ABS" )
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anabasis.standalone.debug "$APP_ABS" )
          # Verify the strip: no static symbol table left, and the plugin must
          # still export its VST3 entry point from .dynsym.
          for BIN in "$SO" "$APP"; do
            if readelf -S "$BIN" | grep -q '\.symtab'; then
              echo "::error::$BIN still carries a .symtab after strip"; exit 1
            fi
          done
          nm -D "$SO" | grep -q GetPluginFactory
          # Written LAST, so it is set only if every objcopy/strip/verify above
          # succeeded. The debug upload gates on it rather than on "the step was
          # not skipped": $DBG is created at the top of this step, so an abort
          # part-way through would otherwise leave an empty directory and make the
          # upload fail a SECOND time on if-no-files-found, burying the real error.
          echo "debug_artifacts=true" >> "$GITHUB_OUTPUT"

      - name: Self-tests (DSP + state)
        id: tests
        run: ./scripts/run-tests.sh

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        # On Linux `strip` is a prerequisite too: it runs BEFORE validation so the gate
        # sees the exact stripped bytes users receive (see the header). If it fails the
        # binaries are in a partially-stripped state nobody ships, and validating them
        # adds a red step that hides the real cause.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        # On Linux `strip` is a prerequisite too: it runs BEFORE validation so the gate
        # sees the exact stripped bytes users receive (see the header). If it fails the
        # binaries are in a partially-stripped state nobody ships, and validating them
        # adds a red step that hides the real cause.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} randomise

      # Customer-artifact safety: staging and upload are gated on the strip step
      # having SUCCEEDED -- never `if: always()` -- so an unstripped binary cannot
      # reach the public artifact if stripping fails. `!cancelled()` (not plain
      # success()) keeps the beta artifact available when only pluginval failed.
      # The staging step additionally self-validates the artifact it just built --
      # on LINUX and macOS as an independent property check (section headers /
      # exported entry point, and slice presence). The Windows equivalent is only
      # a delete-confirmation; see the TODO(P1) in that job.
      - name: Stage Linux artifacts (VST3 + Standalone)
        id: stage
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anabasis-Linux"
          mkdir -p "$DIST"
          cp -R build/Anabasis_artefacts/Release/VST3/Anabasis.vst3 "$DIST/"
          cp    build/Anabasis_artefacts/Release/Standalone/Anabasis "$DIST/Anabasis"
          # ATTRIBUTION IS NOT STAGED (0.1.1, ADR-0021 — the sibling's model,
          # adopted on the owner's directive that the artifacts match it):
          # NOTICE and THIRD_PARTY_LICENSES.md ship as VERSION-NAMED RELEASE
          # PAGE assets instead, where they accompany the distribution without
          # being inside it. The package carries only what a user needs in
          # order to install. RELEASE_POLICY.md §"Third-party attribution" was
          # amended by that ADR to say "accompany", which the release page
          # satisfies and an unversioned copy loose in a zip did not.
          cp packaging/linux/INSTALL.txt "$DIST/INSTALL.txt"
          install -m 755 packaging/linux/install.sh   "$DIST/install.sh"
          install -m 755 packaging/linux/uninstall.sh "$DIST/uninstall.sh"
          # The customer artifact must contain no symbol table and no debug files.
          while IFS= read -r -d '' ELF; do
            if readelf -S "$ELF" 2>/dev/null | grep -q '\.symtab'; then
              echo "::error::customer artifact contains an unstripped binary: $ELF"; exit 1
            fi
          done < <(find "$DIST" -type f \( -name 'Anabasis*' -o -name '*.so' \) -print0)
          # No `-type f`: a .dSYM is a DIRECTORY on macOS, so `-type f` would make
          # that arm permanently dead and the check would read stronger than it is.
          # Linux produces no dSYMs today, but the macOS step calls this "parity
          # with the Linux/Windows staging self-checks" -- so it has to actually be
          # parity. (macOS already omits -type f.)
          if find "$DIST" \( -name '*.debug' -o -name '*.pdb' -o -name '*.dSYM' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # ONE artifact ships from this validated staging dir: Anabasis-Linux
          # uploads the staged FILES themselves, so the zip GitHub serves contains
          # the payload directly -- extract once, no wrapper folder, no nested
          # archive. NOTE: the artifact transport does NOT preserve Unix file
          # modes; a P6 release.yml must restore the executable bits before
          # archiving the published release zip, behind a fail-closed self-check.

      # A failed self-test blocks the CUSTOMER upload (fail-closed: only a build
      # that passed its behavioural gate may ship), while a pluginval-only
      # failure still yields beta artifacts.
      - name: Upload Linux artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-Linux
          path: dist/Anabasis-Linux
          if-no-files-found: error

      # Developer debug artifacts are preserved even when a LATER step fails (they
      # never contain customer-facing binaries) -- but only when the strip step
      # itself completed, which is what actually produced the .debug files.
      - name: Upload Linux debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.strip.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-Linux-debug
          path: dist/Anabasis-Linux-debug
          if-no-files-found: error

  windows:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Default Visual Studio generator (multi-config); MSVC is auto-detected.
      - name: Configure
        run: cmake -B build -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      - name: Self-tests (DSP + state)
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exactly ONE match -- like the staging step below, and like
          # scripts/run-tests.sh. NOT `Select-Object -First 1`: Windows uses the
          # multi-config Visual Studio generator, so a tree ever built in more than
          # one configuration holds several AnabasisTests.exe, and taking whichever
          # enumerates first could run a Debug binary while the artifacts come from
          # Release -- a green gate reporting on the wrong build.
          function Get-OneTestExe {
            param([Parameter(Mandatory)][string]$Name)
            # -ErrorAction SilentlyContinue for the same reason as
            # scripts/run-pluginval.ps1: $ErrorActionPreference is 'Stop', so a
            # missing build/ would make Get-ChildItem THROW and the intended
            # "build first" message below would be unreachable -- the operator
            # would get a .NET stack trace instead of the one-line fix. In CI this
            # step only runs after a successful build, so it is a diagnostics gap
            # rather than a functional one; it is fixed for consistency, because
            # two discovery sites behaving differently is what invites the next bug.
            $found = @(Get-ChildItem -Recurse -Path build -Filter $Name -File -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { Write-Error "$Name not found under build -- build first" }
            if ($found.Count -ne 1) {
              Write-Error ("$Name is ambiguous -- found " + $found.Count + ": " + ($found.FullName -join ', ') +
                           " -- refusing to guess which one the gate should run")
            }
            return $found[0]
          }
          # Locate BOTH before running either, so an ambiguous tree fails before any
          # test output invites a partial reading.
          $exe = Get-OneTestExe -Name AnabasisTests.exe
          $stateExe = Get-OneTestExe -Name AnabasisStateTests.exe
          $ErrorActionPreference = 'Continue'
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $stateExe.FullName

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} -Mode deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} -Mode randomise

      # Release links with /DEBUG (+/OPT:REF,ICF), so linker PDBs exist for the
      # shipped images. They are retained as a SEPARATE debug artifact for crash
      # symbolication and are actively removed from the public artifact.
      #
      # Customer-artifact safety: the order below is deliberate -- locate
      # everything BEFORE copying anything, purge every debug file from the
      # public copy IMMEDIATELY after the copy, and only then run steps that can
      # abort (PDB retention, validation). A failure at any point can therefore
      # never leave a symbol-bearing public artifact behind, and the upload below
      # is additionally gated on this step succeeding.
      #
      # PDB location: the linker does NOT necessarily drop each image's PDB
      # beside the shipped binary under the same name -- JUCE retargets
      # RUNTIME/LIBRARY_OUTPUT_DIRECTORY for the .vst3/.exe but PDB_OUTPUT_DIRECTORY
      # is never set, so /PDB: falls back to the target's own CMake binary
      # directory under $(TargetName). Rather than guess a path, the PDB is
      # identified from the authoritative source: the CodeView (RSDS)
      # debug-directory record MSVC embeds in the linked image itself, which
      # carries the PDB's exact link-time name and path.
      # Gated on the BUILD, not merely on `!cancelled()`: with a failed build there
      # is nothing to stage, and this step would fail a second time on "expected
      # exactly one Anabasis.vst3 bundle, found 0" -- a red step with nothing to do
      # with the real cause. `!cancelled()` still lets it run after a pluginval-only
      # failure, which is the behaviour worth keeping. (The Linux job needs no such
      # guard: its strip step has no `if:` at all, so it skips automatically.)
      - name: Stage Windows artifacts (VST3 + Standalone; PDBs separated)
        id: stage_windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/Anabasis-Windows'
          $dbg  = 'dist/Anabasis-Windows-debug'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path $dbg  | Out-Null

          # Read the CodeView (RSDS) debug-directory record MSVC embeds in a
          # /DEBUG-linked PE image, returning the PDB path exactly as the linker
          # recorded it (or $null if the image carries no debug directory).
          function Get-EmbeddedPdbPath {
            param([Parameter(Mandatory)][string]$ImagePath)
            $bytes = [System.IO.File]::ReadAllBytes($ImagePath)
            if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Error "$ImagePath is not a valid PE image (missing MZ signature)"
            }
            # EVERY offset below is read OUT OF the image being parsed, so each one
            # is bounds-checked before it is used as an index. Without that, a
            # truncated or malformed file throws a raw .NET IndexOutOfRangeException
            # instead of the diagnosable Write-Error this function is written to
            # produce -- and the operator gets a stack trace where a one-line cause
            # was intended. Diagnostics quality, not correctness: these images come
            # from MSVC in this same job.
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or ($peOffset + 24) -gt $bytes.Length) {
              Write-Error "$ImagePath : e_lfanew ($peOffset) points outside the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
              Write-Error "$ImagePath is not a valid PE image (missing PE signature)"
            }
            $coffOffset = $peOffset + 4
            $numberOfSections = [BitConverter]::ToUInt16($bytes, $coffOffset + 2)
            $sizeOfOptionalHeader = [BitConverter]::ToUInt16($bytes, $coffOffset + 16)
            $optHeaderOffset = $coffOffset + 20
            $magic = [BitConverter]::ToUInt16($bytes, $optHeaderOffset)
            $dataDirOffset = $optHeaderOffset + $(if ($magic -eq 0x20B) { 112 } else { 96 })
            $debugEntryOffset = $dataDirOffset + (6 * 8)   # data-directory index 6 = Debug
            if (($debugEntryOffset + 8) -gt $bytes.Length) {
              Write-Error "$ImagePath : optional header / data directories run past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugRva  = [BitConverter]::ToUInt32($bytes, $debugEntryOffset)
            $debugSize = [BitConverter]::ToUInt32($bytes, $debugEntryOffset + 4)
            if ($debugRva -eq 0 -or $debugSize -eq 0) { return $null }
            # Map the debug directory's RVA to a file offset via the section table.
            $sectionTableOffset = $optHeaderOffset + $sizeOfOptionalHeader
            if (($sectionTableOffset + ($numberOfSections * 40)) -gt $bytes.Length) {
              Write-Error "$ImagePath : section table ($numberOfSections sections at $sectionTableOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugFileOffset = -1
            for ($i = 0; $i -lt $numberOfSections; $i++) {
              $s = $sectionTableOffset + ($i * 40)
              $vsize = [BitConverter]::ToUInt32($bytes, $s + 8)
              $vaddr = [BitConverter]::ToUInt32($bytes, $s + 12)
              $rawPtr = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($debugRva -ge $vaddr -and $debugRva -lt ($vaddr + [Math]::Max($vsize, 1))) {
                $debugFileOffset = $rawPtr + ($debugRva - $vaddr); break
              }
            }
            if ($debugFileOffset -lt 0) {
              Write-Error "$ImagePath : could not map the debug directory RVA to a file offset"
            }
            # Walk the IMAGE_DEBUG_DIRECTORY array (28 bytes/entry) for an
            # IMAGE_DEBUG_TYPE_CODEVIEW (2) entry carrying an RSDS record.
            $entryCount = [Math]::Floor($debugSize / 28)
            if (($debugFileOffset + ($entryCount * 28)) -gt $bytes.Length) {
              Write-Error "$ImagePath : debug directory ($entryCount entries at $debugFileOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            for ($i = 0; $i -lt $entryCount; $i++) {
              $e = $debugFileOffset + ($i * 28)
              $type = [BitConverter]::ToUInt32($bytes, $e + 12)
              $pointerToRaw = [BitConverter]::ToUInt32($bytes, $e + 24)
              if ($type -eq 2 -and $pointerToRaw -gt 0) {
                # Bounds-check before indexing: PointerToRawData comes from the
                # image being parsed, so a truncated or malformed file would
                # otherwise throw a raw .NET IndexOutOfRange instead of the
                # intended, diagnosable Write-Error. 28 = Signature(4) + GUID(16)
                # + Age(4), then at least one path byte.
                if ($pointerToRaw + 28 -gt $bytes.Length) {
                  Write-Error "$ImagePath : CodeView record at offset $pointerToRaw runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
                }
                $sig = [BitConverter]::ToUInt32($bytes, $pointerToRaw)
                if ($sig -eq 0x53445352) {   # 'RSDS'
                  # Signature(4) + GUID(16) + Age(4), then a NUL-terminated path.
                  $strStart = $pointerToRaw + 24
                  $strEnd = $strStart
                  while ($strEnd -lt $bytes.Length -and $bytes[$strEnd] -ne 0) { $strEnd++ }
                  return [System.Text.Encoding]::ASCII.GetString($bytes, $strStart, $strEnd - $strStart)
                }
              }
            }
            return $null
          }

          # 1) Locate everything first -- an abort here copies NOTHING public.
          #    Each locate demands EXACTLY ONE match: zero is a build-layout
          #    failure, more than one is ambiguity we refuse to guess about.
          # -ErrorAction SilentlyContinue: see the self-test step -- a missing build/
          # must produce the diagnostic below, not a terminating .NET error.
          $vst3 = @(Get-ChildItem -Recurse -Path build -Filter Anabasis.vst3 -Directory -ErrorAction SilentlyContinue)
          if ($vst3.Count -ne 1) { Write-Error "expected exactly one Anabasis.vst3 bundle, found $($vst3.Count)" }
          $vst3 = $vst3[0]
          $vst3Bin = @(Get-ChildItem -Recurse -Path $vst3.FullName -File | Where-Object { $_.Extension -eq '.vst3' })
          if ($vst3Bin.Count -ne 1) { Write-Error "expected exactly one .vst3 image inside $($vst3.FullName), found $($vst3Bin.Count)" }
          $vst3Bin = $vst3Bin[0]
          $exe = @(Get-ChildItem -Recurse -Path build -Filter Anabasis.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'Standalone' })
          if ($exe.Count -ne 1) { Write-Error "expected exactly one Standalone Anabasis.exe, found $($exe.Count)" }
          $exe = $exe[0]
          # 2) Copy the public artifact. Attribution is deliberately NOT staged
          #    (ADR-0021): NOTICE and THIRD_PARTY_LICENSES.md ship as
          #    version-named release-page assets. See the Linux stage step for
          #    the full reasoning — it is the same rule on all three platforms.
          Copy-Item -Recurse -Force $vst3.FullName $dist
          Copy-Item -Force $exe.FullName $dist
          Copy-Item -Force packaging\windows\INSTALL.txt $dist
          # 3) Purge ALL debug material from the public copy BEFORE any further
          #    step that can abort.
          Get-ChildItem -Recurse -Path $dist -File |
            Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' } |
            Remove-Item -Force
          # 4) Validate the PUBLIC copy and checkpoint it. Everything the customer
          #    artifact needs is done at this point, so `public_ok` is emitted HERE,
          #    before the developer-side PDB work below can abort. $GITHUB_OUTPUT is
          #    read after the step regardless of its outcome, so a later failure
          #    cannot retract it -- the same mechanism the macOS job already uses.
          #    Previously the customer upload gated on this whole step succeeding,
          #    which meant a purely developer-side symbol problem ALSO withheld the
          #    Windows beta artifact, even though the public copy was already
          #    assembled and purged. macOS treats that class of failure as
          #    best-effort, so the two platforms had opposite policies for it.
          #    WHAT THIS CHECK IS, PRECISELY: it re-lists the same extensions step 3
          #    just deleted, so it can only fire if Remove-Item silently failed. That
          #    is a DELETE-CONFIRMATION, not an independent property check, and it is
          #    weaker than the Linux equivalent (which inspects ELF section headers
          #    for .symtab and asserts the stripped .so still exports
          #    GetPluginFactory) and than macOS (which asserts both slices are
          #    present). Nothing here asserts the shipped .vst3 is still loadable.
          #    TODO(P1): add an independent assertion once there is a real binary to
          #    assert against -- the export table is the obvious property, and this
          #    job already parses PE headers for the CodeView record. Do NOT
          #    substitute a raw byte-string search for `GetPluginFactory`: matching
          #    the name anywhere in the file is not evidence that it is exported.
          $leak = Get-ChildItem -Recurse -Path $dist -File |
                  Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' }
          if ($leak) { Write-Error ("customer artifact contains debug files: " + ($leak.FullName -join ', ')) }
          "public_ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # 5) Retain each shipped image's linker PDB, identified via its embedded
          #    CodeView record. DELIBERATELY STRICT, unlike the macOS dSYM capture:
          #    there, a missing dSYM is an EXPECTED consequence of Release+LTO; here
          #    /DEBUG guarantees a PDB, so its absence means the build or this logic
          #    is wrong and must be seen. The strictness now costs only the -debug
          #    artifact, which is what it is actually protecting.
          foreach ($img in @(@{ tag = 'vst3'; bin = $vst3Bin }, @{ tag = 'standalone'; bin = $exe })) {
            $recordedPdbPath = Get-EmbeddedPdbPath -ImagePath $img.bin.FullName
            if (-not $recordedPdbPath) {
              Write-Error ("no CodeView debug-directory entry embedded in " + $img.bin.FullName +
                           " -- expected one because Release links with /DEBUG (CMakeLists.txt AnabasisHardening); " +
                           "debug artifact would be wrong/incomplete")
            }
            $pdbName = Split-Path -Leaf $recordedPdbPath
            $pdbFile = $null
            if (Test-Path -LiteralPath $recordedPdbPath -PathType Leaf) {
              $pdbFile = Get-Item -LiteralPath $recordedPdbPath
            } else {
              $candidates = @(Get-ChildItem -Recurse -Path build -Filter $pdbName -File)
              if ($candidates.Count -ne 1) {
                Write-Error ("PDB '" + $pdbName + "' (recorded in " + $img.bin.FullName + "'s debug info at link " +
                             "time) not found uniquely under build/ -- found " + $candidates.Count +
                             " -- debug artifact would be wrong/incomplete")
              }
              $pdbFile = $candidates[0]
            }
            Copy-Item -Force $pdbFile.FullName (Join-Path $dbg ("Anabasis." + $img.tag + ".pdb"))
          }
          # Written LAST, for the same reason as the Linux strip step: $dbg is
          # created at the top of this step, so gating the debug upload on "this
          # step was not skipped" would fire it against an empty directory when the
          # step aborts before the PDB copies -- a second, misleading failure on
          # if-no-files-found on top of the real one.
          # -Encoding utf8 is explicit: the runner uses pwsh 7 (UTF-8 by default),
          # but Windows PowerShell 5.1 would write UTF-16LE and the runner would
          # not parse the output at all.
          "debug_artifacts=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The Inno Setup installer is built FROM the staged payload, so it gates
      # on the same `public_ok` checkpoint the customer zip does: repacking a
      # tree that failed validation would launder a rejected build into an
      # installer. ISCC ships preinstalled on windows-latest.
      - name: Package Windows installer (Inno Setup)
        id: package_windows
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage_windows.outputs.public_ok == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The version comes from CMakeLists.txt, the single source
          # release.yml also validates the tag against — never from a workflow
          # literal, which is the copy that goes stale on the next bump.
          $m = Select-String -Path CMakeLists.txt -Pattern '^project\(Anabasis VERSION ([0-9]+\.[0-9]+\.[0-9]+) '
          if (-not $m) { Write-Error 'could not read the version from CMakeLists.txt' }
          $version = $m.Matches[0].Groups[1].Value
          $staging = (Resolve-Path 'dist/Anabasis-Windows').Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$version" "/DStagingDir=$staging" '/Odist' 'packaging/windows/Anabasis.iss'
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE" }
          $out = "dist/Anabasis-$version-Windows-Installer.exe"
          if (-not (Test-Path $out)) { Write-Error "installer not produced at $out" }

      - name: Upload Windows installer
        if: ${{ !cancelled() && steps.package_windows.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-Windows-installer
          path: dist/Anabasis-*-Windows-Installer.exe
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage_windows.outputs.public_ok == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-Windows
          path: dist/Anabasis-Windows
          if-no-files-found: error

      - name: Upload Windows debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.stage_windows.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-Windows-debug
          path: dist/Anabasis-Windows-debug
          if-no-files-found: error

  macos:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-14   # Apple Silicon runner; we build a universal binary
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install ninja || true

      # CMAKE_OSX_DEPLOYMENT_TARGET=10.13 — DELIBERATE (OQ-011, resolved at P1).
      # JUCE 9's documented deployment floor is macOS 10.11 (pinned tree,
      # README "Deployment Targets"), so 10.13 sits above it; it matches the
      # sibling product, keeping one support claim across the family. The value
      # governs the x86_64 slice; the arm64 slice floors at 11.0 by toolchain
      # regardless. Supported-OS claim: macOS 10.13+ (Intel), 11.0+ (Apple
      # Silicon) — restated in docs/architecture/COMPATIBILITY_MATRIX.md, which
      # landed 2026-08-05 (this comment asked for it "when that document lands
      # (P2)"; it arrived later than that target). The first macOS CI run is the
      # warning-free check on this value.
      #
      # This note lives OUTSIDE the `run:` scalar deliberately. In a YAML folded
      # block (`run: >`) every line is joined into ONE shell line and `#` has no
      # YAML meaning, so an inline comment there silently swallows every argument
      # after it -- which is exactly what happened to the two flags below before
      # this was moved out.
      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + AU + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      - name: Self-tests (DSP + state)
        id: tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-tests.sh

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} randomise

      # Order matters -- 1) dsymutil captures a universal dSYM per bundle (the
      # only crash-symbolication source once stripped), 2) strip -x removes local
      # symbols, 3) codesign LAST (stripping after signing would invalidate the
      # seal). Signing and slice verification are NOT '|| true': a failure must
      # fail the job, not silently ship a broken artifact.
      #
      # dsymutil WARNINGS ARE NOT FATAL. Under Release + LTO the DWARF the linked
      # binary references lives in the linker's TEMPORARY LTO object, already
      # deleted when dsymutil runs; dsymutil then warns, exits 0, and emits a
      # dSYM without usable DWARF. That is an expected property of the build
      # configuration, not a broken customer artifact. dSYM capture is therefore
      # BEST-EFFORT and judged on its OUTPUT, never on warning text: a produced
      # dSYM is kept only if its DWARF payload exists, its UUID set matches the
      # binary's slices exactly, and it carries at least one DWARF compile unit;
      # anything else is discarded with a ::warning:: and packaging CONTINUES.
      # The customer pipeline (strip -x -> codesign -> verify) is never blocked by
      # debug-capture problems. Restoring full macOS symbolication needs the LTO
      # object persisted via -Wl,-object_path_lto -- a linker-flag change that is
      # a deliberate future decision, not a silent addition.
      # Gated on the BUILD (see the Windows staging step): with a failed build
      # `strip -x` would run against a nonexistent binary and fail a second time.
      - name: Package macOS plugins (VST3 + AU + Standalone)
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anabasis-macOS"
          DBG="dist/Anabasis-macOS-debug"
          mkdir -p "$DIST" "$DBG"
          VST3="build/Anabasis_artefacts/Release/VST3/Anabasis.vst3"
          AU="build/Anabasis_artefacts/Release/AU/Anabasis.component"
          APP="build/Anabasis_artefacts/Release/Standalone/Anabasis.app"
          USABLE_DSYMS=0
          for B in "$VST3" "$AU" "$APP"; do
            BIN="$B/Contents/MacOS/Anabasis"
            NAME="$(basename "$B")"
            DSYM="$DBG/$NAME.dSYM"
            # ---- Best-effort developer dSYM capture: nothing in this block may
            # abort the job -- failures degrade to a ::warning:: and the dSYM is
            # discarded. Customer-artifact steps are NOT gated on it.
            DSYM_OK=1
            BIN_UUIDS="$(dwarfdump --uuid "$BIN" | awk '{print $2}' | sort)" || BIN_UUIDS=""
            if [ -z "$BIN_UUIDS" ]; then
              echo "::warning::$NAME: cannot read Mach-O slice UUIDs -- a dSYM would be unvalidatable, skipping debug capture"
              DSYM_OK=0
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DSYMUTIL_LOG="$(mktemp)"
              if ! dsymutil "$BIN" -o "$DSYM" >"$DSYMUTIL_LOG" 2>&1; then
                cat "$DSYMUTIL_LOG"
                echo "::warning::$NAME: dsymutil failed -- continuing without a dSYM (best-effort debug capture)"
                DSYM_OK=0
              elif [ -s "$DSYMUTIL_LOG" ]; then
                # Informational only: usability is decided by validating the
                # OUTPUT below, never by the presence of dsymutil warnings.
                cat "$DSYMUTIL_LOG"
              fi
              rm -f "$DSYMUTIL_LOG"
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DWARF_FILE="$DSYM/Contents/Resources/DWARF/$(basename "$BIN")"
              if [ ! -s "$DWARF_FILE" ]; then
                echo "::warning::$NAME: dSYM has no (or an empty) DWARF payload -- discarding it (expected under Release+LTO)"
                DSYM_OK=0
              else
                DSYM_UUIDS="$(dwarfdump --uuid "$DWARF_FILE" | awk '{print $2}' | sort)" || DSYM_UUIDS=""
                CU_COUNT="$(dwarfdump --debug-info "$DWARF_FILE" 2>/dev/null | grep -c 'DW_TAG_compile_unit' || true)"
                if [ "$DSYM_UUIDS" != "$BIN_UUIDS" ]; then
                  echo "::warning::$NAME: dSYM UUIDs do not match the binary's slices -- discarding the mismatched dSYM"
                  DSYM_OK=0
                elif [ "$CU_COUNT" -eq 0 ]; then
                  echo "::warning::$NAME: dSYM carries no DWARF compile units (degenerate) -- discarding it"
                  DSYM_OK=0
                fi
              fi
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              USABLE_DSYMS=$((USABLE_DSYMS + 1))
              echo "$NAME: validated dSYM captured (UUID-matched, $CU_COUNT compile units)"
            else
              rm -rf "$DSYM"
            fi
            # ---- Customer artifact: stripping ALWAYS proceeds -- debug capture
            # problems never weaken or skip it.
            strip -x "$BIN"
          done
          if [ "$USABLE_DSYMS" -eq 0 ]; then
            echo "::warning::no usable dSYM was produced (expected under Release+LTO) -- the -debug upload will be skipped; crash symbolication is unavailable for this build"
          fi
          # Written BEFORE codesign/copy/verification below so dSYMs captured
          # above still upload even if those later steps fail.
          echo "debug_artifacts=$([ "$USABLE_DSYMS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Ad-hoc codesign so macOS will load the bundles after quarantine removal.
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$APP"
          cp -R "$VST3" "$DIST/"
          cp -R "$AU"   "$DIST/"
          cp -R "$APP"  "$DIST/"
          # Attribution is deliberately NOT staged (ADR-0021): NOTICE and
          # THIRD_PARTY_LICENSES.md ship as version-named release-page assets.
          # See the Linux stage step for the full reasoning.
          cp packaging/macos/INSTALL.txt "$DIST/INSTALL.txt"
          # ASSERT both slices are present -- do not merely print them. `lipo -archs`
          # exits 0 for ANY valid Mach-O, including a thin one, so echoing its output
          # verifies nothing: an arm64-only build would ship labelled "universal" and
          # Intel users would get a plug-in that cannot load. Not hypothetical -- a
          # folded-scalar comment once swallowed the trailing configure flags in this
          # very workflow, and the same accident on -DCMAKE_OSX_ARCHITECTURES produces
          # exactly that thin build.
          for B in "$DIST/Anabasis.vst3/Contents/MacOS/Anabasis" \
                   "$DIST/Anabasis.component/Contents/MacOS/Anabasis" \
                   "$DIST/Anabasis.app/Contents/MacOS/Anabasis"; do
            ARCHES="$(lipo -archs "$B")"
            echo "== $B == $ARCHES"
            for WANT in arm64 x86_64; do
              case " $ARCHES " in
                *" $WANT "*) ;;
                *) echo "::error::$B is missing the $WANT slice (found: $ARCHES) -- not a universal binary"; exit 1 ;;
              esac
            done
          done
          # The stripped, signed plugin must still expose its VST3 entry point.
          nm -gU "$DIST/Anabasis.vst3/Contents/MacOS/Anabasis" | grep -q GetPluginFactory
          # The customer artifact must contain no debug material (parity with the
          # Linux/Windows staging self-checks).
          if find "$DIST" \( -name '*.dSYM' -o -name '*.debug' -o -name '*.pdb' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # NOTE: the artifact transport drops executable bits; a P6 release.yml
          # must restore them on Contents/MacOS/* before archiving the release
          # zip. The ad-hoc signature lives inside each Mach-O and in
          # Contents/_CodeSignature (ordinary files), so it survives the round
          # trip -- only the mode bits need restoring.

      # Built FROM the validated staged payload, exactly as the Windows
      # installer is: `packaging/macos/build-pkg.sh` copies the three bundles
      # into component roots and self-checks the result (identifiers,
      # customise-allowed, all three components pre-selected).
      - name: Package macOS installer (.pkg)
        id: package_macos
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.package.outcome == 'success' }}
        run: |
          set -e
          VERSION=$(sed -nE 's/^project\(Anabasis VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)
          [ -n "$VERSION" ] || { echo "::error::could not read the version from CMakeLists.txt"; exit 1; }
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh dist/Anabasis-macOS "$VERSION" "dist/Anabasis-${VERSION}-macOS.pkg"

      - name: Upload macOS installer
        if: ${{ !cancelled() && steps.package_macos.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-macOS-installer
          path: dist/Anabasis-*-macOS.pkg
          if-no-files-found: error

      - name: Upload macOS plugins (VST3 + AU + Standalone)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-macOS
          path: dist/Anabasis-macOS
          if-no-files-found: error

      # Uploaded only when at least one VALIDATED dSYM was captured: with zero
      # usable dSYMs the upload is skipped -- with a warning already emitted by
      # the package step -- instead of failing on an empty directory.
      - name: Upload macOS debug symbols (dSYMs, crash symbolication)
        if: ${{ !cancelled() && steps.package.outcome != 'skipped' && steps.package.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anabasis-macOS-debug
          path: dist/Anabasis-macOS-debug
          if-no-files-found: error
