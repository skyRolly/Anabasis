name: Build & Validate

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  # Lets a future release.yml REUSE this exact build+validation matrix on a
  # release tag (single build, same gates, artifacts land in the caller run).
  # Purely additive -- branch/PR/dispatch behaviour is unchanged, and tag
  # pushes still do not trigger THIS workflow (the `branches` filter excludes
  # tag events).
  workflow_call:

permissions:
  contents: read

# One in-flight run per ref. Pushing three times in ten minutes previously left
# three full 3-OS matrices racing, which is both wasteful and confusing to read.
#
# cancel-in-progress is GUARDED ON THE REF rather than set to a bare `true`:
# this workflow is also reached through `workflow_call` from release.yml, and a
# release build must never be cancelled by an unrelated push. Tag refs therefore
# queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# ---------------------------------------------------------------------------
# pluginval strictness escalates with the project phase, and lives in ONE place
# so raising the bar is a one-line edit. THIS BLOCK IS THAT PLACE. The two
# documents that describe the gate defer to it and state no number of their
# own: docs/policies/TESTING_POLICY.md owns what the gate REQUIRES (suites,
# modes, passes, platforms) and docs/procedures/CI_CD.md owns how the pipeline
# is WIRED. They pointed at each other for the value for one round, which is
# how the ladder ended up copied into prose twice.
#
# The env var below is the value in force RIGHT NOW, unconditionally, on every
# branch — it is not phase-gated at runtime; the phases are the history of how
# the bar was raised:
#
#     P1-P2 (skeleton, DSP core)      -> 5    development bar
#     P3-P5 (metering, adaptive, UI)  -> 8    standard gate
#     P6 / every release              -> 10   pre-release gold standard,
#                                             REQUIRED (in force since
#                                             2026-08-02)
#
# Lowering it below the current phase's value is a deliberate act that must be
# justified in the PR. This block is cited as the single authority for the
# number, so it carries no duplicate rows: the 2026-08-02 raise briefly added a
# second P6 line that disagreed with the first.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE CLANG MAJOR IS PINNED, and for the same one-place reason (ADR-0031, 0.2.0).
#
# SINCE 0.2.1 IT ALSO BUILDS THE SHIPPED LINUX BINARY (ADR-0032). Until then the
# pin governed diagnostics and sanitizers while the artifact users install was
# produced by whatever `g++` the runner image happened to carry -- so the one
# property nothing pinned was the codegen of the thing that ships. The pin now
# reaches the artifact, and GCC moved to where a compatibility compiler belongs:
# `linux-lto-tests`.
#
# `linux` gates on ZERO first-party warnings. Which diagnostics Clang
# emits is a property of the COMPILER VERSION -- `-Wshadow-field`,
# `-Wsign-conversion`, `-Wmissing-prototypes` and `-Wunused-but-set-variable`
# have all moved between majors -- so an unpinned `clang` means the bar that
# gate measures against is whatever `ubuntu-latest` happens to resolve to that
# week. A runner-image bump would then turn the gate red on a push that changed
# nothing in the tree, or, worse, quietly green with fewer diagnostics.
#
# It is also a HARD REQUIREMENT for the `realtime` job rather than a preference:
# RealtimeSanitizer arrived in Clang 20, and Ubuntu's archives for `noble` stop
# at clang-20 with no `libclang_rt.rtsan` for a newer major. The pinned install
# comes from apt.llvm.org via `scripts/setup-llvm-apt.sh`, which is upstream's
# own channel for this distribution.
#
# 22 is the current upstream stable major and is the version the sibling product
# pins, which keeps the two products' Clang diagnostics comparable -- the whole
# point of sharing an engineering standard across a product family. Moving it is
# a Build System change under the Architecture Review Gate (see that document's
# "Compiler and toolchain versions" rule 1) and needs an ADR.
#
# DELIBERATELY NOT PAIRED WITH A WARNING BASELINE FILE. The sibling carries
# `clang-warning-baseline.txt` and `gcc-warning-baseline.txt`, debt lists of
# accepted first-party warnings; this repository gates BOTH compilers on zero
# instead, which is the stricter contract, and the 0.2.0 migration audit rejected
# importing those files for exactly that reason. If a pin ever surfaces
# diagnostics, they get FIXED. Measured before the gate was written, not after:
# clang-22.1.8 and g++-14.2.0 each emit zero first-party warnings on this tree.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE GCC MAJOR IS PINNED TOO, for the same reason and with a different answer
# to "from where" (ADR-0033, 0.2.1).
#
# GCC is the COMPATIBILITY compiler here, not the shipping one: `linux-lto-tests`
# is its only job. A second major toolchain is worth keeping precisely because it
# disagrees -- it accepts and rejects different code, and it warns about
# different things -- and that value is only real while WHICH GCC is a fact of
# this file rather than of a runner image.
#
# FROM THE OFFICIAL `gcc` IMAGE, NOT FROM apt (ADR-0034, 0.2.2), and the reason
# is that the version and the acquisition method are one decision rather than
# two. No package source ships a RELEASED g++-16: Noble stops at `g++-14`, and
# the `g++-16` in `ubuntu-toolchain-r/test` and in Ubuntu 26.04 are trunk
# snapshots that predate the 16.1 release -- the "newest, not stable" a toolchain
# pin exists to refuse. The official image is the only package-managed route to a
# released 16, which is why the sibling uses it and why 0.2.1's argument for
# staying on 14 was backwards: it chose the version to fit the acquisition
# method. `linux-lto-tests` therefore runs `container: gcc:${ANABASIS_GCC_VERSION}`.
#
# THE TAG FLOATS ON THE MAJOR, deliberately, and it is the one pin in this file
# that is not exact. `gcc:16` resolves to the newest 16.x the image publishes, so
# patch releases arrive with no commit here -- which is what a COMPATIBILITY
# checker wants and what a SHIPPING toolchain must not have. Nothing downstream
# needs the patch: the job asserts the MAJOR from `-dumpversion`, so 16.2 -> 16.3
# is silent and a tag that ever resolved to 17 is loud.
#
# `dependency-profile: headless` comes with it, and is not optional: inside that
# image `build-essential` would install a DISTRIBUTION gcc over the pinned one
# and un-pin the lane silently.
#
# Moving this major is a Build System change under the Architecture Review Gate,
# exactly like the Clang one.
# ---------------------------------------------------------------------------
env:
  ANABASIS_PLUGINVAL_STRICTNESS: 10
  ANABASIS_CLANG_VERSION: 22
  ANABASIS_GCC_VERSION: 16

# Every push builds the FULL set of formats on all three desktop OSes so beta
# testers can install on any platform:
#   * Linux   -> VST3 + Standalone
#   * Windows -> VST3 + Standalone
#   * macOS   -> VST3 + AU + Standalone  (universal arm64 + x86_64)
#
# Validation is UNIFORM across all three platforms and BLOCKING on each:
# pluginval at the phase strictness, run in two explicit modes -- deterministic
# and randomise -- each repeated 3 consecutive times (scripts/run-pluginval.sh on
# Linux/macOS, scripts/run-pluginval.ps1 on Windows). A non-zero pluginval exit
# fails the job on every platform (no continue-on-error / swallowed exit codes).
# Both mode steps carry the SAME explicit condition, so they report independently:
# a DETERMINISTIC failure never skips randomise, and the job still fails if either
# mode fails. That condition names the steps which must have succeeded for the
# binary to be worth validating -- the build, plus (on LINUX ONLY) the strip, which
# there runs BEFORE validation so the gate sees the exact stripped bytes users
# receive. A failure in either leaves nothing meaningful to validate, and running
# anyway would only add a red step that hides the real cause.
#
# Symbol handling: every platform generates full debug info, retains it as a
# separate *-debug artifact (split .debug / PDB / dSYM) for crash symbolication,
# and ships STRIPPED public binaries.
#
# ASYMMETRY, stated rather than glossed: ONLY LINUX validates the shipped bytes.
# Its strip step runs BEFORE pluginval, so the gate sees exactly what users get.
# On macOS `strip -x` + ad-hoc codesign happen in the packaging step AFTER
# pluginval, and on Windows the public copy is produced after validation too --
# so on those two platforms a defect introduced BY stripping or signing would
# ship unvalidated. Reordering them is not free (macOS must codesign last, or the
# seal breaks), so it is a real design question to settle at P6 when there is a
# binary to measure against, not something to guess at now. Recorded in
# docs/procedures/CI_CD.md and docs/OPEN_QUESTIONS.md (OQ-012).
#
# On macOS the dSYM capture is BEST-EFFORT: under Release+LTO the DWARF needed
# for dSYM reconstruction may no longer exist at packaging time, in which case
# the -debug upload is skipped with a warning while the customer artifacts ship
# normally.
#
# Customer uploads are gated on the self-tests AND their strip/packaging steps
# SUCCEEDING (never `if: always()`), and the staging steps self-validate (no
# symbol table, no debug files in the public copy) -- neither a partial packaging
# failure nor a failed behavioural gate can ship a customer artifact. ON LINUX
# THE LIST IS LONGER since ADR-0032 made that the shipping job: the upload also
# names the engine reproduction and the channel probe, which are the two
# instruments that read the SHIPPED bundle rather than a rebuild of its sources
# (see that step for why). Developer *-debug artifacts and (on pluginval-only
# failures) beta artifacts remain available.

jobs:
  # -------------------------------------------------------------------------
  # Documentation structure lint (scripts/check-docs.py).
  #
  # Runs in the pre-P1 scaffold too -- which is exactly when the documentation
  # IS the deliverable -- so it deliberately does NOT depend on `preflight` or
  # on CMakeLists.txt existing.
  #
  # Deliberately NOT a dependency of the build jobs either: a prose defect
  # should fail the run, not skip a binary that is otherwise fine.
  #
  # `--self-test` runs FIRST and is the load-bearing half. The checker once
  # reported this repository "50 file(s) clean" while an unclosed fence exempted
  # 1382 lines of its largest document from every check, so "the script exited 0"
  # is not evidence unless the script's own guarantees were exercised in the same
  # run. Both commands are plain `python3` invocations with no dependencies
  # beyond the standard library.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # THE MERGE RESULT -- the one tree no push build ever compiles (0.2.0).
  #
  # `actions/checkout` on a `pull_request` event checks out `refs/pull/N/merge`,
  # so this job builds the PR merged with the base AS IT STANDS RIGHT NOW. That
  # is the tree the merge button produces, and nothing else in this workflow sees
  # it: every other job is skipped on a same-repo PR because the push trigger
  # already built the same SHA -- the TIP, not the merge. So a semantic conflict
  # between a PR and a base that moved under it reaches `main` unbuilt.
  #
  # SCOPED TO SAME-REPO PRs, the exact complement of the guard every other job
  # carries. A fork PR is not covered by the push trigger, so it already runs the
  # full matrix and does not need this. Under `workflow_call` the caller's event
  # decides: release.yml triggers on a tag push and workflow_dispatch, so this
  # job is skipped on every release and rehearsal, which is correct -- a tag has
  # no merge result.
  #
  # BUILD AND SELF-TESTS ONLY, and that is the whole design. What a moved base
  # breaks is compilation and behaviour, and both are platform-independent.
  # Packaging, pluginval and the other two platforms validate properties of the
  # TIP that the push build already gated, so re-running them here would restore
  # the duplicate matrix the same-repo guard exists to remove. No artifacts are
  # produced: this job answers "does the merge build and pass", not "what would
  # we ship".
  # -------------------------------------------------------------------------
  merge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE SAME PRE-P1 GUARD THE OTHER BUILD JOBS GET, INLINED RATHER THAN
      # TAKEN AS A `needs:`, and the difference is forced rather than stylistic.
      #
      # `preflight` carries the same-repo-PR skip every other job relies on, so
      # on THIS job's only event it does not run at all. `needs: preflight` would
      # therefore skip merge-check outright and report the whole workflow green
      # while building nothing -- which is precisely the hazard that job's own
      # comment warns about ("would get ZERO build jobs while still reporting
      # success"), reached from the other direction.
      #
      # So the CHECK is duplicated and the JOB is not. The behaviour is the one
      # every other build job has: on a tree with no `CMakeLists.txt` the
      # configure never runs and the job passes with a notice instead of failing
      # on a missing project. If `preflight` is ever deleted -- it is a permanent
      # no-op now that the build exists -- this stays correct on its own.
      - name: Pre-P1 guard
        id: preflight
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CMakeLists.txt (pre-P1 scaffold) -- the merge-result build is skipped."
          fi

      # THE PINNED CLANG, because this job's whole purpose is to answer "does the
      # merge build" about the tree the merge button produces -- and since 0.2.1
      # the compiler that answers it for `main` is clang-22 (ADR-0032). A
      # merge-check on a different compiler from the one that will build the
      # merge result is a check of a tree nobody ships.
      - name: Install build dependencies
        if: steps.preflight.outputs.ready == 'true'
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANABASIS_CLANG_VERSION }}

      # Shares the `linux` job's lineage on purpose: this job compiles the same
      # sources with the same compiler in the same configuration, so the entries
      # are interchangeable and a merge-check is nearly free after the push build
      # of either parent has populated it. That sharing is why the two moved to
      # Clang together -- one of them left behind would have kept a second full
      # lineage alive inside the same cache budget, and the two would evict each
      # other.
      - name: Restore the compiler cache
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-release-${{ github.run_id }}
          restore-keys: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-release-

      - name: Configure
        if: steps.preflight.outputs.ready == 'true'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANABASIS_CLANG_VERSION }}
          -DANABASIS_BUILD_STANDALONE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + tests)
        if: steps.preflight.outputs.ready == 'true'
        run: cmake --build build --target Anabasis_VST3 AnabasisTests AnabasisStateTests

      - name: DSP + state self-tests
        if: steps.preflight.outputs.ready == 'true'
        run: |
          ./build/AnabasisTests_artefacts/Release/AnabasisTests
          ./build/AnabasisStateTests_artefacts/Release/AnabasisStateTests

      - name: Compiler cache statistics
        if: ${{ !cancelled() && steps.preflight.outputs.ready == 'true' && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same rationale as `preflight` below: skip the duplicate same-repo PR event,
    # keep fork PRs (which the push trigger does not reach). Two consequences of
    # sharing that guard, stated here so neither is discovered later:
    #   * On a same-repo PR this job reports as SKIPPED in the PR's checks list.
    #     It can still be made a required status check, but only if the branch
    #     protection accepts a skipped conclusion as passing -- the lint has
    #     already run on the branch push for that same SHA.
    #   * The `workflow_call` hazard documented for `preflight` applies verbatim:
    #     inside a reusable workflow `github.event_name` reflects the CALLER's
    #     event, so a future caller invoked on a same-repo pull_request would skip
    #     this job too. Unlike the build jobs nothing gates on it, so the failure
    #     mode is a missing check rather than a green run with zero builds.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint documentation structure
        run: |
          python3 scripts/check-docs.py --self-test
          python3 scripts/check-docs.py

  # -------------------------------------------------------------------------
  # Source portability lint (scripts/check-portability.py).
  #
  # THIS JOB EXISTS BECAUSE A BUILD JOB CANNOT REPLACE IT. Between 2026-08-08
  # and 2026-08-10 the macOS job failed to COMPILE on every push while Linux and
  # Windows stayed green, on one line: `juce::jmax<size_t> (1, v.size())`. An
  # explicit template argument is substituted into JUCE's dsp::SIMDRegister
  # overload of the same name, and completing SIMDRegister<size_t> needs
  # SIMDNativeOps<size_t> -- which exists only where size_t names one of JUCE's
  # ten SIMD element typedefs. On Linux glibc uint64_t IS unsigned long IS
  # size_t, so it completes; on macOS libc++ uint64_t is unsigned long long, so
  # it does not.
  #
  # The divergence is in the TYPEDEF, not the front end, so NO Linux compiler
  # can see it -- adding a Linux+Clang job (this workflow now has one, for other
  # reasons) would NOT have caught this. A lint is the only Linux-runnable
  # guard, which is why it is a separate, seconds-long job rather than a step
  # inside a build.
  #
  # Runs on ubuntu-latest with no build, no dependencies beyond the standard
  # library, and no `needs:` -- a source defect should fail the run on its own
  # terms, not wait behind a toolchain.
  # -------------------------------------------------------------------------
  source-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same same-repo-PR guard as `docs` above, for the same reasons.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check-citations.py` compares against a BASE REVISION, so the run
          # needs history rather than the default single-commit checkout.
          fetch-depth: 0
      # PROVE EACH CHECKER IS LIVE BEFORE TRUSTING ITS SILENCE -- TESTING_POLICY
      # rule 5, and it says "in the same job, ahead of the check it vouches
      # for" for a reason a different arrangement would lose: a liveness proof
      # in another job proves nothing about the run whose silence is being read
      # here. Both of these are seconds and need nothing but Python, so they run
      # before the lints rather than after.
      #
      # The portability lint's `--compile-canary` is NOT this and does not
      # replace it: that step lives in `linux` because it needs the pinned
      # JUCE on disk, and it answers "does the dependency still HAVE the
      # hazard?". This answers "does the CHECKER still find it?" -- a question
      # about ~200 lines of hand-written lexing in that file, and the half that
      # can silently stop working without anything going red.
      - name: Portability lint self-test (the lint still fires, and still stays quiet)
        run: python3 scripts/check-portability.py --self-test
      - name: Citation-gate self-test (recognition, mapping and rewriting)
        run: python3 scripts/check-citations.py --self-test
      # The THIRD realtime tier (ADR-0029), and the only one that needs no build
      # and runs on every platform. RTSan and the allocation guard both see only
      # the code the suite EXECUTES; measured with gcov on this tree, the DSP
      # suite runs 73.7 % of the lines and 63.4 % of the branches in `src/dsp`,
      # so better than a third of the branches are invisible to both of them.
      # This one reads the text.
      - name: Realtime lint self-test (the lint still fires, and still stays quiet)
        run: python3 scripts/check-realtime.py --self-test
      - name: Lint audio-path bodies (REALTIME_AUDIO_POLICY forbidden constructs)
        run: python3 scripts/check-realtime.py
      - name: Lint source portability (JUCE SIMD overload hazard)
        run: python3 scripts/check-portability.py
      # Evidence anchors (`src/PluginProcessor.cpp:695-752`) are exact and
      # therefore fragile: an edit ABOVE one silently re-aims it at unrelated
      # code while the document keeps reading as though it were still correct.
      # The repository's rule is that anchors are re-anchored in the SAME change
      # set that moves them, and 0.1.4 demonstrated that the rule does not
      # survive being remembered — the anchors were re-anchored once, two later
      # commits in the same round moved code again, and 42 of 71 were stale
      # before anyone noticed. This is that rule as a gate.
      #
      # WHAT IT COMPARES AGAINST, precisely — the comment here used to say
      # "the merge base" and neither branch of the shell below computed one.
      #
      #   * pull_request — FORK pull requests only. This job carries the same
      #     same-repo guard the `docs` job does, so a same-repo branch never
      #     reaches this event here; do not read the branch below as the normal
      #     case.
      #
      #     `base.sha` is fed through `git merge-base`, and it is worth being
      #     accurate about what that buys, because an earlier version of this
      #     comment claimed it found "the fork point". It does not, on this
      #     event: `actions/checkout` checks out the GENERATED MERGE COMMIT
      #     (`refs/pull/N/merge`), whose first parent IS `base.sha`, so
      #     `merge-base` returns `base.sha` verbatim and the hop is a no-op.
      #     It is kept because it is the correct expression of the intent and
      #     stops being a no-op the moment the checkout names the PR head
      #     instead — not because it is doing work today.
      #   * push — the normal path for work in this repository, and the one that
      #     actually holds the line. `event.before` is the branch's previous tip,
      #     so each push is judged against its immediate predecessor: ONE PUSH OF
      #     DRIFT AT A TIME. That is narrower than a merge base, and it is still
      #     sufficient for the failure this gate exists to catch — 0.1.4's stale
      #     anchors came from two LATER commits in the same round, and each of
      #     those is a push. It is sufficient only while every push is checked,
      #     which is why this job has no `needs:` and cannot be skipped by a
      #     failing build.
      #
      # Two ways `event.before` is unusable, both tested for below: on the first
      # push of a branch it is all-zeros, and after a FORCE-PUSH it names a
      # commit the repository may no longer have at all — `git show` then fails
      # every file and the script reports "nothing to check against" and exits 2,
      # a red gate that says nothing about the documents. Both fall back to
      # `HEAD~1` with a notice, which under-checks rather than failing on a
      # question it cannot answer.
      - name: Check documentation evidence anchors
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # A merge base exists only when the two share history; a force-push
            # that rewrote the fork point can leave them disjoint.
            BASE="$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")"
          else
            BASE=''
          fi
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            echo "::notice::No usable base revision for this event; falling back to $BASE"
          fi
          echo "Comparing evidence anchors against $BASE"
          python3 scripts/check-citations.py --check --base "$BASE"

  # -------------------------------------------------------------------------
  # Pre-P1 guard. This repository is currently a scaffold: the governance docs,
  # scripts and workflows exist, but there is no CMakeLists.txt and no src/
  # (docs/DEVELOPMENT_BRIEF.md §11 -- the build lands at P1). Without this
  # check every push would report a red build for a project that has not been
  # written yet, which trains everyone to ignore CI.
  #
  # The moment CMakeLists.txt appears this job outputs ready=true and becomes a
  # permanent no-op; it may then be deleted, but does no harm if left.
  # -------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repo pull_request events are skipped entirely: `push: ["**"]` already
    # built that exact SHA, so running the 3-OS matrix again on the PR event is a
    # duplicate build per commit for as long as the PR is open. Fork PRs are NOT
    # covered by the push trigger (the push happens in the fork), so they still
    # run -- which is the only case the pull_request trigger uniquely serves here.
    #
    # LATENT HAZARD for `workflow_call` (P6): inside a reusable workflow,
    # `github.event_name` reflects the CALLER's event. A future caller invoked on a
    # same-repo pull_request would therefore skip this job -- and, because every
    # build job gates on `needs.preflight.outputs.ready`, would get ZERO build jobs
    # while still reporting success. The planned caller (release.yml) is
    # tag-push-triggered, so this is latent, not broken. Re-check it when release.yml
    # lands; see docs/procedures/CI_CD.md.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CMakeLists.txt yet (pre-P1 scaffold) -- build and validation jobs are skipped."
          fi

  linux:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE PINNED CLANG BUILDS THE SHIPPED BYTES (ADR-0032, 0.2.1).
      # `setup-llvm-apt.sh` verifies the apt.llvm.org signing key by identity and
      # installs `clang-<n>`, `lld-<n>` and `libclang-rt-<n>-dev` together, so the
      # linker that resolves the LTO archive is version-matched to the compiler by
      # construction -- which is the property CMakeLists.txt's `-fuse-ld=lld`
      # block depends on, and which the plugin's `juce_recommended_lto_flags`
      # link needs on this platform.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANABASIS_CLANG_VERSION }}

      # THE COMPILER CACHE (0.2.0). Every Linux job here previously fetched and
      # compiled JUCE from scratch on every push -- four full builds of a
      # dependency that changes only when its pinned SHA does. ccache is keyed on
      # preprocessed source and the compiler's identity, so a JUCE bump or a
      # compiler pin change invalidates it correctly by construction.
      #
      # AN OPTIMIZATION, NEVER A REQUIREMENT. The composite action publishes an
      # EMPTY `ANABASIS_COMPILER_LAUNCHER` if ccache cannot be installed, and the
      # configure step below passes it through unset -- slower, never different.
      # A cache hit changes where the .o files came from, never what they
      # contain.
      #
      # THE LINEAGE IS PER JOB and stays here rather than in the action, because
      # it is the part that is genuinely different in each: which compiler
      # produced the objects, and which build directory. `github.run_id` in the
      # key makes every run write a fresh entry; `restore-keys` is what makes it
      # read the previous one.
      #
      # THE MAJOR IS IN THE KEY. `CCACHE_COMPILERCHECK` already makes a different
      # compiler MISS rather than collide, so this is about eviction and not
      # correctness: a lineage shared between two compilers holds two full sets
      # of objects in one budget and the two evict each other. Spelling the major
      # here means changing the pin starts a clean lineage instead of thrashing
      # the old one. This lineage is shared with `merge-check` -- same compiler,
      # same configuration -- and, since 0.2.1, it is the one the deleted
      # `linux-clang` job used to own.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-release-${{ github.run_id }}
          restore-keys: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-release-

      - name: Configure
        # ANABASIS_BUILD_BENCH is ON here and nowhere else. The bench stays OFF
        # by default (a benchmark that always builds gets run casually and
        # quoted without its machine — the C2 failure PERFORMANCE_BUDGET.md
        # guards against), but OFF everywhere meant `tests/bench.cpp` was
        # compiled by no automated job at all: its DSP calls would rot silently
        # the first time a signature moved, and the rot would only surface when
        # someone re-ran the measurement the budget's refresh rule requires.
        # Building it on ONE platform costs a translation unit and makes the
        # rot a red build. It is still never RUN in CI — timings from a shared
        # runner are exactly the numbers that must not be quoted.
        # TWO residuals, stated so this is not mistaken for full cover.
        # (a) Only THIS platform compiles it, so a signature change behind
        #     `#if JUCE_MAC` or `JUCE_WINDOWS` could still rot the bench.
        # (b) Compiling is not running: a change that KEEPS every signature but
        #     breaks the measurement's semantics — a stage that now needs a
        #     per-sample `tick()`, say — builds green here and only surfaces
        #     when someone re-runs the budget refresh. Cover for that is a human
        #     re-measure, which PERFORMANCE_BUDGET.md already requires; it is
        #     deliberately not a CI job, because the numbers a shared runner
        #     produces are exactly the ones that must not be quoted.
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANABASIS_CLANG_VERSION }}
          -DANABASIS_BUILD_BENCH=ON -DANABASIS_BUILD_PROBE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      # ABSORBED FROM THE DELETED `linux-clang` JOB (0.2.1). The canary belongs
      # where the pinned JUCE is already on disk and the pinned Clang is already
      # installed, which is this job now. It asserts that the hazard `source-lint`
      # guards is still REAL for the pinned revision -- the deduced form must
      # compile and the explicit form must not -- so a JUCE bump that changes the
      # SIMDRegister overload set fails here instead of silently turning the lint
      # into a no-op (INC-003).
      - name: Portability compile canary (pinned JUCE still has the hazard)
        run: >
          python3 scripts/check-portability.py --compile-canary build/_deps/juce-src/modules
          --cxx clang++-${{ env.ANABASIS_CLANG_VERSION }}

      # PROVE THE GATE IS LIVE BEFORE TRUSTING ITS SILENCE -- the same move
      # `check-docs.py --self-test` and the canary above make, for the same
      # reason: a checker that has stopped matching anything is indistinguishable
      # from a clean tree. Run BEFORE the build so a broken classifier fails in
      # seconds rather than after the full compile.
      - name: Warning-gate self-test (the classifier still classifies)
        run: python3 scripts/check-clang-warnings.py --self-test

      # THE LOG IS KEPT because this job now carries the first-party warning gate
      # the deleted `linux-clang` used to run in a second, near-identical Release
      # build. The gate itself runs LATE, after the artifact uploads -- see that
      # step for why.
      - name: Build (VST3 + Standalone + tests + bench)
        id: build
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee clang-build.log

      # A cache hit changes where the .o files came from, never what they
      # contain, so the link is fed identical input. Note what the strip step
      # reads: `objcopy --only-keep-debug` operates on the LINKED binary, not on
      # the objects, so object provenance cannot reach it. macOS is the case
      # where provenance looks like it might matter -- `dsymutil` walks the debug
      # map back to the object files -- and 0.2.2 settled it: a cached object is
      # a real `.o` at the path the linker recorded, so that walk reads the same
      # files either way, and the macOS jobs are cached too.
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      # Capture split debug info, then strip the shipped binaries. Runs BEFORE
      # pluginval so the release gate validates the exact stripped bytes users
      # receive. --strip-unneeded keeps .dynsym (the VST3 entry points hosts
      # resolve); the .debug files carry the full symbol/debug info for crash
      # symbolication and ship as a SEPARATE artifact, never inside the public one.
      - name: Extract debug symbols + strip shipped binaries
        id: strip
        run: |
          set -e
          SO="build/Anabasis_artefacts/Release/VST3/Anabasis.vst3/Contents/x86_64-linux/Anabasis.so"
          APP="build/Anabasis_artefacts/Release/Standalone/Anabasis"
          # NEVER MAKE THIS DIR A DESCENDANT OF THE PUBLIC ONE. The invariant is
          # about PATH ANCESTRY, not string prefixes: "dist/Anabasis-Linux" IS a
          # string prefix of "dist/Anabasis-Linux-debug" today and that is fine,
          # because `upload-artifact` treats `path: dist/Anabasis-Linux` as a
          # literal directory and `find "$DIST"` descends only that directory --
          # neither matches by prefix. What would break is a rename to a nested
          # layout (dist/Anabasis-Linux/debug), which puts the .debug files inside
          # the uploaded tree AND inside the leak-checked tree at once: shipped
          # symbols, or a failing leak check, depending on the pattern.
          DBG="dist/Anabasis-Linux-debug"
          mkdir -p "$DBG"
          objcopy --only-keep-debug "$SO"  "$DBG/Anabasis.vst3.so.debug"
          objcopy --only-keep-debug "$APP" "$DBG/Anabasis.standalone.debug"
          strip --strip-unneeded "$SO"
          strip --strip-unneeded "$APP"
          # objcopy stores the debuglink filename EXACTLY as given, and a debugger
          # resolves it relative to the stripped binary's own directory (then
          # .debug/, then the global debug dir). Passing "$DBG/..." would bake in a
          # CI-workspace-relative path that exists on no user's machine, so the
          # downloaded -debug artifact would never be found automatically. Run
          # objcopy from inside $DBG and pass the bare basename, which is the
          # conventional lookup; the binary paths are made absolute first because
          # the working directory changes.
          SO_ABS="$(readlink -f "$SO")"; APP_ABS="$(readlink -f "$APP")"
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anabasis.vst3.so.debug    "$SO_ABS" )
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anabasis.standalone.debug "$APP_ABS" )
          # Verify the strip: no static symbol table left, and the plugin must
          # still export its VST3 entry point from .dynsym.
          for BIN in "$SO" "$APP"; do
            if readelf -S "$BIN" | grep -q '\.symtab'; then
              echo "::error::$BIN still carries a .symtab after strip"; exit 1
            fi
          done
          nm -D "$SO" | grep -q GetPluginFactory
          # Written LAST, so it is set only if every objcopy/strip/verify above
          # succeeded. The debug upload gates on it rather than on "the step was
          # not skipped": $DBG is created at the top of this step, so an abort
          # part-way through would otherwise leave an empty directory and make the
          # upload fail a SECOND time on if-no-files-found, burying the real error.
          echo "debug_artifacts=true" >> "$GITHUB_OUTPUT"

      # MALLOC_PERTURB_ FILLS FRESH HEAP WITH A NON-ZERO PATTERN and freed heap
      # with its complement. It is here because of KI-009: Linux hands back
      # zero-filled pages and macOS does not, so a read-before-write is benign
      # here and poisonous there — the symptom is platform-specific while the
      # DEFECT is not. This makes the Linux run behave like the hostile
      # allocator for free: no rebuild, no instrumentation, no slowdown.
      #
      # 255 on purpose rather than an arbitrary byte: 0xFF fills a float buffer
      # with NaN, so an uninitialised READ of audio state fails an assertion
      # instead of passing on a plausible-looking value. glibc-only, which is
      # why it is set here and in `linux-lto-tests` and NOT on the macOS job, where
      # libmalloc ignores it and the variable would only read as coverage that
      # does not exist. valgrind in `sanitizers` answers the same question more
      # thoroughly and far more slowly; this is the cheap one, on every push.
      - name: Self-tests (DSP + state)
        id: tests
        env:
          MALLOC_PERTURB_: 255
        run: ./scripts/run-tests.sh

      # ---- THE TWO REPRODUCTIONS, AND WHY THEY ARE HERE ---------------------
      #
      # ABSORBED FROM `linux-clang` (0.2.1), and the absorption is the point.
      # INC-004 was undefined behaviour in the engine's channel loop that ONLY
      # Clang, and only at `-flto`, acted on -- so every non-LTO artefact (both
      # suites, the sanitizer builds, valgrind) was green for five months while
      # the bundle a user installs dropped a channel. That is why these two
      # instruments were pointed at a Clang build in the first place. Until this
      # round the Clang build they were pointed at was a SECOND one that was
      # thrown away; now it is the build that ships.
      #
      # Engine first, bundle second, and the order is the diagnosis: the repro
      # drives `AnabasisEngine` with no wrapper, no format and no host, so a
      # failure there says the defect is in the DSP core; a repro that passes
      # while the probe fails says it is not.
      #
      # BOTH CARRY AN `id`, and it is load-bearing rather than tidy: the customer
      # upload below names them. A probe that reports a lost channel while the
      # artifact ships anyway is a gate in name only.
      - name: Engine reproduction (no wrapper, no format, no host)
        id: repro
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./build/AnabasisEngineRepro_artefacts/Release/AnabasisEngineRepro

      # THE KI-009 PROBE -- the only step here that tests the artefact a USER
      # installs rather than a rebuild of its sources. `AnabasisStateTests`
      # drives the real processBlock, but compiled into a console app: no LTO
      # (ADR-0008 keeps the flags target on the plugin alone), no format wrapper,
      # one architecture. The probe LOADS the built bundle through
      # juce_audio_processors, so host -> wrapper -> processBlock -> engine ->
      # output is the shipped code path including whatever the optimiser did to
      # it, and its oracle is the field report's own question: is there audio on
      # BOTH channels. Exit 2 = could not load/configure (environment); exit 1 =
      # a channel was actually lost. Different codes on purpose.
      - name: Channel probe (hosts the built VST3)
        id: probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # xvfb because the macro scenario opens the editor, exactly as
        # run-pluginval.sh does for the same reason. Absent a display the
        # scenario still runs (the mapping timer is the processor's), but the
        # reported configuration includes the UI, so give it one where we can.
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then RUN="xvfb-run -a"; else RUN=""; fi
          # --assert-discriminating: this probe's table is also the evidence a
          # DEPENDENCY BUMP is judged by (ADR-0028 compared two JUCE builds row
          # by row). Agreement between two runs only means something if the rows
          # differ from EACH OTHER -- a collapsed scenario set makes any two
          # builds agree perfectly while testing nothing. The flag refuses to
          # report a baseline it has not shown to be discriminating; the one pair
          # that genuinely coincides is declared in the source with its measured
          # reason, and anything new fails.
          $RUN ./build/AnabasisChannelProbe_artefacts/Release/AnabasisChannelProbe \
               build/Anabasis_artefacts/Release/VST3/Anabasis.vst3 --format vst3 \
               --assert-discriminating

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        # On Linux `strip` is a prerequisite too: it runs BEFORE validation so the gate
        # sees the exact stripped bytes users receive (see the header). If it fails the
        # binaries are in a partially-stripped state nobody ships, and validating them
        # adds a red step that hides the real cause.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        # On Linux `strip` is a prerequisite too: it runs BEFORE validation so the gate
        # sees the exact stripped bytes users receive (see the header). If it fails the
        # binaries are in a partially-stripped state nobody ships, and validating them
        # adds a red step that hides the real cause.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} randomise

      # Customer-artifact safety: staging and upload are gated on the strip step
      # having SUCCEEDED -- never `if: always()` -- so an unstripped binary cannot
      # reach the public artifact if stripping fails. `!cancelled()` (not plain
      # success()) keeps the beta artifact available when only pluginval failed.
      # The staging step additionally self-validates the artifact it just built --
      # on LINUX and macOS as an independent property check (section headers /
      # exported entry point, and slice presence). The Windows equivalent is only
      # a delete-confirmation; see the TODO(P1) in that job.
      - name: Stage Linux artifacts (VST3 + Standalone)
        id: stage
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anabasis-Linux"
          mkdir -p "$DIST"
          cp -R build/Anabasis_artefacts/Release/VST3/Anabasis.vst3 "$DIST/"
          cp    build/Anabasis_artefacts/Release/Standalone/Anabasis "$DIST/Anabasis"
          # ATTRIBUTION IS NOT STAGED (0.1.1, ADR-0021 — the sibling's model,
          # adopted on the owner's directive that the artifacts match it):
          # NOTICE and THIRD_PARTY_LICENSES.md ship as VERSION-NAMED RELEASE
          # PAGE assets instead, where they accompany the distribution without
          # being inside it. The package carries only what a user needs in
          # order to install. RELEASE_POLICY.md §"Third-party attribution" was
          # amended by that ADR to say "accompany", which the release page
          # satisfies and an unversioned copy loose in a zip did not.
          cp packaging/linux/INSTALL.txt "$DIST/INSTALL.txt"
          install -m 755 packaging/linux/install.sh   "$DIST/install.sh"
          install -m 755 packaging/linux/uninstall.sh "$DIST/uninstall.sh"
          # The customer artifact must contain no symbol table and no debug files.
          while IFS= read -r -d '' ELF; do
            if readelf -S "$ELF" 2>/dev/null | grep -q '\.symtab'; then
              echo "::error::customer artifact contains an unstripped binary: $ELF"; exit 1
            fi
          done < <(find "$DIST" -type f \( -name 'Anabasis*' -o -name '*.so' \) -print0)
          # No `-type f`: a .dSYM is a DIRECTORY on macOS, so `-type f` would make
          # that arm permanently dead and the check would read stronger than it is.
          # Linux produces no dSYMs today, but the macOS step calls this "parity
          # with the Linux/Windows staging self-checks" -- so it has to actually be
          # parity. (macOS already omits -type f.)
          if find "$DIST" \( -name '*.debug' -o -name '*.pdb' -o -name '*.dSYM' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # ONE artifact ships from this validated staging dir: Anabasis-Linux
          # uploads the staged FILES themselves, so the zip GitHub serves contains
          # the payload directly -- extract once, no wrapper folder, no nested
          # archive. NOTE: the artifact transport does NOT preserve Unix file
          # modes; a P6 release.yml must restore the executable bits before
          # archiving the published release zip, behind a fail-closed self-check.

      # THE CUSTOMER GATE, AND IT NAMES EVERY BEHAVIOURAL CHECK ON THE SHIPPED
      # BYTES. Fail-closed: only a build that passed all of them may ship.
      #
      # `tests` and `stage` were here from the start. `repro` and `probe` joined
      # them when ADR-0032 made this the SHIPPING job (0.2.1), and that is the
      # point of the absorption rather than a detail of it. While those two
      # instruments lived in the discarded `linux-clang` build their outcome
      # could not sensibly gate an upload from a different job; now they run
      # against the exact bundle staged into `dist/`, so a probe reporting a lost
      # channel -- the KI-009 / INC-004 defect they exist to catch -- has to stop
      # the artifact rather than merely redden a job that already uploaded it.
      #
      # A SKIPPED step does not satisfy `== 'success'`, so an earlier failure
      # that skips either instrument blocks this upload too. That is the intended
      # direction: the gate asks "did this pass", never "did this not fail".
      #
      # `stage` is deliberately NOT gated on them, and nothing is lost by that.
      # It self-validates the tree it builds (no symbol table, no debug files)
      # and produces the `dist/` copy the ABI floor assertion reads -- a
      # compatibility FINDING is still worth reporting on a build that failed a
      # behavioural gate. Nothing ships from it while this step is skipped, which
      # is the property that matters.
      #
      # pluginval is still absent from this list, unchanged: a pluginval-only
      # failure yields beta artifacts on purpose (see the header block).
      - name: Upload Linux artifacts
        if: >-
          ${{ !cancelled()
              && steps.tests.outcome == 'success'
              && steps.repro.outcome == 'success'
              && steps.probe.outcome == 'success'
              && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-Linux
          path: dist/Anabasis-Linux
          if-no-files-found: error

      # Developer debug artifacts are preserved even when a LATER step fails (they
      # never contain customer-facing binaries) -- but only when the strip step
      # itself completed, which is what actually produced the .debug files.
      - name: Upload Linux debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.strip.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-Linux-debug
          path: dist/Anabasis-Linux-debug
          if-no-files-found: error

      # THE SHIPPED LINUX ABI FLOOR (ADR-0029 round, 0.2.0). A Linux binary
      # records, per imported symbol, the oldest glibc/libstdc++ version that
      # provides it; the maximum of those is the oldest system it can load on at
      # all. Nothing decided this project's number -- it fell out of whichever
      # image `ubuntu-latest` resolved to -- and nothing reported it, so the
      # compatibility claim for Linux was "it builds on ubuntu-latest", which is
      # a statement about CI rather than about users.
      #
      # RUN LAST, AFTER THE UPLOADS, and deliberately: a compatibility FINDING
      # must not withhold the beta artifact whose behavioural gates all passed.
      # It still fails the job.
      #
      # ON THE STRIPPED BYTES -- the same files the user receives. `strip`
      # removes symbol tables, never version references, so the answer is the
      # same either way; reading the shipped copy means it cannot drift from
      # what shipped.

      # The self-test reads no artifact -- it asserts that the checker still
      # fires on a synthetic binary -- so it keeps `strip` as its gate: it is
      # worth running whenever the pipeline got as far as producing binaries at
      # all, including on the run where staging is what failed.
      - name: ABI floor self-test (the checker still fires)
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: python3 scripts/check-linux-abi.py --self-test

      # GATED ON THE STEP THAT WRITES THE FILES IT READS, which is `stage`, not
      # `strip`. The two conditions coincide today (`stage` is itself gated on
      # `strip` succeeding), so this is not a live bug -- it is the coupling that
      # makes it one the moment `stage`'s own gate changes: this step would then
      # run against an empty `dist/` and fail with "cannot read", pointing the
      # reader at the ABI rather than at the staging step that actually broke.
      #
      # IT REMAINS FAIL-CLOSED. `stage` skipping or failing does not let an
      # unvalidated binary through: the upload step carries the same
      # `steps.stage.outcome == 'success'` precondition, so there is no run in
      # which an artifact ships while this assertion is skipped, and a failing
      # `stage` fails the job on its own.
      - name: Assert the shipped Linux ABI floor
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          python3 scripts/check-linux-abi.py \
            "dist/Anabasis-Linux/Anabasis.vst3/Contents/x86_64-linux/Anabasis.so" \
            "dist/Anabasis-Linux/Anabasis"

      # THE FIRST-PARTY WARNING GATE, ABSORBED FROM `linux-clang` (0.2.1) AND
      # RUN LAST, after the uploads, for the same reason the ABI assertion above
      # is: a DIAGNOSTIC finding must not withhold the beta artifact whose
      # behavioural gates all passed. It still fails the job.
      #
      # Classification is STRUCTURAL rather than textual: every diagnostic's path
      # is resolved (absolute as-is, relative against the build directory the
      # compiler ran in) and then asked whether it lands under `src/`, `tests/` or
      # `tools/` without passing through a `_deps` component. The previous form
      # was an anchored `grep` on the absolute spelling -- which did match, and CI
      # has the receipts (run 31449400277's `linux-clang` failed on
      # `tools/channel_probe.cpp`) -- but it could only ever match ONE spelling of
      # a path the build system is free to change, with no signal if that stopped
      # being the spelling. `scripts/check-clang-warnings.py` carries the full
      # reasoning.
      #
      # ZERO, not a baseline: see the compiler-pin block above the jobs.
      - name: Gate first-party Clang warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          python3 scripts/check-clang-warnings.py
          --log clang-build.log
          --root "${{ github.workspace }}"
          --build-dir "${{ github.workspace }}/build"
          --compiler "clang++-${{ env.ANABASIS_CLANG_VERSION }}"

  # -------------------------------------------------------------------------
  # Sanitizers (Linux). The point of this job is to catch, ON LINUX, defects
  # that only MANIFEST on another platform.
  #
  # KI-009 (a single silent channel, reproducible on macOS and not on Linux) put
  # the read-before-write hypothesis at the top of the list: memory that Linux
  # hands back zero-filled is arbitrary on macOS, so an uninitialised read is
  # benign here and poisonous there. That defect is platform-INDEPENDENT even
  # though its symptom is not, and tooling sees it regardless of which bytes the
  # allocator happened to supply.
  #
  # ASan+UBSan cover out-of-bounds, lifetime and undefined behaviour -- the last
  # of which also matters because UB is what lets -O3 + LTO on a different
  # target legally delete a guard.
  #
  # THE FLAG SET IS THE SIBLING'S, WITH ONE SUB-CHECK LEFT OUT AND THE REASON
  # MEASURED (0.2.2, ADR-0034). Five sub-checks beyond `address,undefined` are
  # adopted -- `vptr`, `float-divide-by-zero`, `implicit-conversion`,
  # `local-bounds`, `nullability` -- behind a narrowly scoped
  # `-fsanitize-ignorelist` (`scripts/ubsan-ignorelist.txt`: one sub-check, one
  # vendored tree, no first-party path).
  #
  # `unsigned-shift-base` is the one NOT adopted, and it is deliberate rather
  # than an omission. Measured, it fires exactly once, on
  # `AnabasisEngine.cpp`'s dither RNG: `rngState ^= rngState << 13` on a
  # `uint32_t`. That shift is WELL DEFINED -- unsigned left shift wraps modulo
  # 2^32 -- and the wrap IS the xorshift algorithm. The check is explicitly a
  # not-UB check for shifts that are OFTEN unintentional, and a xorshift is the
  # canonical case where they are not. The alternatives were worse: an ignorelist
  # entry would exempt FIRST-PARTY code, and would have to exempt the whole
  # enclosing `processChunk`; and the generator itself is frozen by DSP_POLICY
  # (offline renders must repeat exactly), so rewriting it is a hard-stop item,
  # not a sanitizer accommodation. Leaving the sub-check off exempts nothing --
  # the other five instrument every translation unit, first-party included. MemorySanitizer, the dedicated uninitialised
  # -read tool, is deliberately NOT used: it requires every dependency including
  # libc++ and all of JUCE to be instrumented, and an uninstrumented dependency
  # produces false positives rather than silence. valgrind memcheck answers the
  # same question with no rebuild of anything, so it carries that half.
  #
  # valgrind runs BOTH suites. It is ~50x slower than native, and that cost is
  # accepted because memcheck is the only uninitialised-read detector in the
  # pipeline and the read that would matter runs through the real wrapper
  # `processBlock` -- which only AnabasisStateTests drives. An earlier revision
  # pointed it at the DSP suite alone, which aimed the detector away from the
  # span KI-009 implicates.
  #
  # detect_leaks=0: JUCE's singletons are torn down at exit in ways LeakSanitizer
  # reports and this job is not a leak gate. halt_on_error=1 on UBSan so the
  # first violation fails the job rather than scrolling past.
  # -------------------------------------------------------------------------
  sanitizers:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 800M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE PINNED MAJOR (ADR-0031) carries the sanitizer runtime with it:
      # `libclang-rt-<major>-dev` is in the same fail-closed transaction as the
      # compiler, so this job and `realtime` cannot end up on different
      # toolchains. Before the pin this job installed the unsuffixed
      # `libclang-rt-dev` alias, which does not exist on every image and failed
      # as "cannot find libclang_rt.asan-x86_64.a" -- a link error that reads as
      # a project problem and is not one. valgrind stays an image package and is
      # the one thing this job cannot run without, so it is fail-closed too.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANABASIS_CLANG_VERSION }}
          extra-packages: valgrind

      # THE COMPILER CACHE (0.2.0). Every Linux job here previously fetched and
      # compiled JUCE from scratch on every push -- four full builds of a
      # dependency that changes only when its pinned SHA does. ccache is keyed on
      # preprocessed source and the compiler's identity, so a JUCE bump or a
      # compiler pin change invalidates it correctly by construction.
      #
      # AN OPTIMIZATION, NEVER A REQUIREMENT. The composite action publishes an
      # EMPTY `ANABASIS_COMPILER_LAUNCHER` if ccache cannot be installed, and the
      # configure step below passes it through unset -- slower, never different.
      # A cache hit changes where the .o files came from, never what they
      # contain.
      #
      # THE LINEAGE IS PER JOB and stays here rather than in the action, because
      # it is the part that is genuinely different in each: which compiler
      # produced the objects, and which build directory. `github.run_id` in the
      # key makes every run write a fresh entry; `restore-keys` is what makes it
      # read the previous one.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-sanitizers-clang${{ env.ANABASIS_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-sanitizers-clang${{ env.ANABASIS_CLANG_VERSION }}-


      - name: Configure (Clang, ASan + UBSan)
        run: >
          cmake -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-divide-by-zero,implicit-conversion,local-bounds,nullability -fsanitize-ignorelist=${{ github.workspace }}/scripts/ubsan-ignorelist.txt -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,vptr,float-divide-by-zero,implicit-conversion,local-bounds,nullability -fsanitize-ignorelist=${{ github.workspace }}/scripts/ubsan-ignorelist.txt -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,vptr,float-divide-by-zero,implicit-conversion,local-bounds,nullability"
          -DANABASIS_BUILD_STANDALONE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build test targets (sanitized)
        run: cmake --build build-san --target AnabasisTests AnabasisStateTests

      # `detect_leaks=1` SINCE 0.2.2, AND IT WAS AN ASSUMPTION UNTIL THEN. This
      # step used to set `detect_leaks=0` with a comment saying JUCE's singletons
      # are torn down at exit in ways LeakSanitizer reports. Measured on the
      # pinned clang-22 with the flag set below: nothing is reported, both suites
      # exit 0. The three checks after it were measured clean at the same time
      # and only ever tighten the gate. `detect_stack_use_after_return` is NOT
      # listed: it is clang's Linux default, and restating a default is the copy
      # that rots when the default moves.
      #
      # THE RAISED STACK IS PART OF THE GATE, not a workaround for a defect.
      # `testTeardownAndReengageInvariants` constructs FOUR
      # `AnabasisAudioProcessor` objects, each in its own scope. Uninstrumented,
      # the compiler reuses one stack slot for all four; ASan's use-after-scope
      # instrumentation gives each its own slot plus redzones, so the frame
      # becomes their sum -- and with the deeper flag set that sum passes 8 MB and
      # the suite dies with a stack-overflow report at the function's opening
      # brace. Measured: 8 MB overflows, 64 MB passes. Restructuring the test to
      # heap-allocate would work too and is a source change this has no reason to
      # make.
      - name: Self-tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1:strict_init_order=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ulimit -s 65536
          ./build-san/AnabasisTests_artefacts/RelWithDebInfo/AnabasisTests
          ./build-san/AnabasisStateTests_artefacts/RelWithDebInfo/AnabasisStateTests

      # Uses the UNSANITIZED Release binary on purpose: memcheck and ASan
      # instrument the same memory and running them together is neither faster
      # nor more sensitive. This is the only uninitialised-read detector in the
      # pipeline (see the MemorySanitizer note above), so its exit code is the
      # gate: --error-exitcode makes a reported error fail the job, which is not
      # valgrind's default.
      # -DANABASIS_NO_ALLOC_GUARD IS REQUIRED HERE, and it is a correctness
      # requirement rather than a preference. `tests/AllocationGuard.h` replaces
      # `operator new`/`delete` and forwards the delete side to `std::free`,
      # which is the CONSISTENT pairing for the memory `rawAlloc` returns --
      # ordinary glibc heap blocks. memcheck does not follow that reasoning: it
      # intercepts the `new`/`delete` and `malloc`/`free` families SEPARATELY
      # and tracks which family produced each block, so every delete through the
      # guard is reported as "Mismatched free() / delete / delete []".
      # Measured on this repository, GCC 13.3 Release, the DSP suite alone:
      # hundreds of such reports and a non-zero exit under the invocation below,
      # which `--error-exitcode=1` turns into a red job.
      #
      # Nothing is lost by standing the guard down here. memcheck answers a
      # different question (uninitialised reads), the allocation counters are
      # asserted in the `linux` and `linux-lto-tests` builds where they are live, and
      # `selfCheck()` DISCLOSES that both halves are compiled out so the suite
      # skips its allocation assertions with a note rather than passing a
      # vacuous zero. memcheck leaves no compile-time marker to detect, which is
      # why this is a flag rather than a feature test like the RTSan case.
      - name: Configure + build both suites (unsanitized, for valgrind)
        run: |
          cmake -B build-vg -G Ninja -DCMAKE_BUILD_TYPE=Release -DANABASIS_BUILD_STANDALONE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER="${ANABASIS_COMPILER_LAUNCHER}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${ANABASIS_COMPILER_LAUNCHER}" \
            -DCMAKE_CXX_FLAGS=-DANABASIS_NO_ALLOC_GUARD
          cmake --build build-vg --target AnabasisTests AnabasisStateTests

      # BOTH suites, and the state one is the point. memcheck is the only
      # uninitialised-read detector in the pipeline, and the read that would
      # matter runs through the real wrapper `processBlock` — which only
      # AnabasisStateTests drives. Pointing the detector at the DSP suite alone
      # would have aimed it away from the path KI-009 implicates. It is ~50x
      # slower than native and worth every second of it for that reason.
      - name: valgrind memcheck (both suites)
        run: |
          VG="valgrind --tool=memcheck --track-origins=yes --leak-check=no
              --error-exitcode=1 --error-limit=no --num-callers=25"
          $VG ./build-vg/AnabasisTests_artefacts/Release/AnabasisTests
          $VG ./build-vg/AnabasisStateTests_artefacts/Release/AnabasisStateTests

  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # LTO VALIDATION, PART 1 OF 2: THE OTHER MAJOR TOOLCHAIN, WHOLE-PROGRAM.
  # ADR-0033 (the lane) and ADR-0034 (the container and the pin, 0.2.2).
  #
  # GCC IS THE COMPATIBILITY COMPILER, NOT THE SHIPPING ONE. Clang builds the
  # artifact (`linux`, ADR-0032); this job exists so the tree keeps compiling,
  # and its invariants keep holding, under the other major toolchain -- and it is
  # the only job whose GCC this repository CHOSE (the `sanitizers` job's
  # unsanitized `build-vg` copy uses the image's default `g++`, unpinned and
  # incidental to a memcheck run).
  #
  # WHY AN IMAGE AND NOT `apt`, which every other Linux toolchain here uses: no
  # package source ships a stable GCC 16. Noble stops at `g++-14`; the `g++-16`
  # in `ubuntu-toolchain-r/test` and in Ubuntu 26.04 are trunk snapshots that
  # predate the 16.1 release, which is the "newest, not stable" a pin exists to
  # refuse. The official image is the only package-managed route to a RELEASED
  # 16. 0.2.1 pinned `g++-14` from apt instead and argued the container was the
  # sibling's problem; the 0.2.2 parity audit found that backwards -- it had
  # chosen the version to fit the acquisition method.
  #
  # THE TAG IS LITERAL, and it has to be: the `container:` key cannot read the
  # `env` context. `ANABASIS_GCC_VERSION` is still the single authority, and the
  # assertion step below is what enforces the agreement -- a tag edited without
  # the env (or the reverse) fails in seconds rather than drifting.
  # -------------------------------------------------------------------------
  linux-lto-tests:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No compiler in `extra-packages`: the container IS the compiler, so there
      # is nothing to install and nothing that could resolve to a different one.
      #
      # `headless`, because this is the one job whose dependencies are NOT the
      # ones a fresh Ubuntu machine needs. It builds two test targets and no GUI,
      # so the pluginval fetch/display pair and lld are dead weight -- and
      # `build-essential` is worse than dead weight: it would install a
      # distribution GCC over the top of the pinned one this container exists to
      # provide. The profile also names `python3` explicitly, which matters here
      # and nowhere else: the warning gate is a Python script and this image
      # carries an interpreter only transitively.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          dependency-profile: headless

      # Asserted BEFORE the build so the log carries the version the run was made
      # with, and so a wrong image fails in seconds rather than at the end of a
      # warning gate. The MAJOR only, matching what the tag pins: a 16.2 -> 16.3
      # move must pass, and a tag that ever resolved to 17 must fail here.
      - name: Assert the container is the pinned GCC major
        run: |
          set -eu
          g++ --version | head -1
          cmake --version | head -1
          ninja --version
          got="$(g++ -dumpversion)"
          if [ "${got%%.*}" != "${ANABASIS_GCC_VERSION}" ]; then
            echo "::error::container g++ is ${got}, but env declares major ${ANABASIS_GCC_VERSION}"
            exit 1
          fi

      # Its own lineage: `-flto` objects are GIMPLE bytecode under GCC, so they
      # share no entries with the `linux` job's native ones, and a shared lineage
      # would only have the two evict each other inside one budget. The major is
      # in the key for the same reason it is in `linux`'s: changing the pin starts
      # a clean lineage instead of thrashing the old one.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-gcc${{ env.ANABASIS_GCC_VERSION }}-lto-${{ github.run_id }}
          restore-keys: ccache-ubuntu-gcc${{ env.ANABASIS_GCC_VERSION }}-lto-

      # `-flto` ON THE COMPILE AND ON THE LINK. Both are required and they are
      # not the same switch: the compile flag emits bytecode instead of machine
      # code, and the link flag is what runs the optimiser over the whole program
      # afterwards. GCC links this through binutils with its own LTO plugin -- no
      # lld, which is why `headless` can drop it.
      - name: Configure (GCC, -flto on the test suites)
        run: |
          ccache --zero-stats || true
          cmake -B build-lto -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="-flto" \
            -DCMAKE_CXX_FLAGS="-flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto" \
            -DANABASIS_BUILD_STANDALONE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }} \
            -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Warning-gate self-test (the classifier still classifies)
        run: python3 scripts/check-clang-warnings.py --self-test

      # THE TWO TARGETS ARE THE WHOLE FIRST-PARTY SURFACE, which is what makes
      # this the right job to carry the gate rather than a job of its own:
      # `AnabasisStateTests` compiles ${ANABASIS_PLUGIN_SOURCES} (every
      # `src/*.cpp` outside `dsp/`) and both targets compile `src/dsp/*.cpp`
      # through the `AnabasisDSP` INTERFACE library, so between them every
      # first-party translation unit is built here. The gate costs one `tee` and
      # one python invocation, not a runner.
      #
      # The script's NAME is the only Clang-specific thing about it: it matches
      # the `path:line:col: warning:` shape both compilers emit and classifies by
      # RESOLVED PATH. This is the only warning gate GCC gets, and it gates at
      # ZERO with no baseline file -- deliberately unlike the sibling's debt
      # list, and the stricter contract (see the compiler-pin block).
      - name: Build the suites (LTO), gating on first-party warnings
        run: |
          set -o pipefail
          cmake --build build-lto --target AnabasisTests AnabasisStateTests 2>&1 | tee gcc-lto-build.log
          python3 scripts/check-clang-warnings.py \
            --log gcc-lto-build.log \
            --root "${GITHUB_WORKSPACE}" \
            --build-dir "${GITHUB_WORKSPACE}/build-lto" \
            --compiler "g++-${ANABASIS_GCC_VERSION}"

      - name: Self-tests against LTO codegen
        env:
          MALLOC_PERTURB_: 255      # see the `linux` job's self-test step
        run: |
          ./build-lto/AnabasisTests_artefacts/Release/AnabasisTests
          ./build-lto/AnabasisStateTests_artefacts/Release/AnabasisStateTests

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

  # -------------------------------------------------------------------------
  # LTO VALIDATION, PART 2 OF 2: THE SHIPPED OPTIMIZATION CLASS (ADR-0033).
  #
  # THIS JOB HAS NO SIBLING COUNTERPART, and the reason is an incident rather
  # than a preference. INC-004 was undefined behaviour in the engine's channel
  # loop that only Clang, and only at `-flto`, acted on. By ADR-0008 the two
  # console suites do NOT link `juce_recommended_lto_flags`; the plugin does. So
  # for five months the 1,174 assertions, the sanitizer builds and valgrind were
  # all green against non-LTO objects while the bundle a user installs dropped a
  # channel. `linux` closes half of that -- it builds, hosts and ships the LTO'd
  # plugin -- and this job closes the other half: the ASSERTIONS, run against the
  # optimization class that ships. A GCC-only lane cannot answer that question,
  # which is why the sibling's single arm is not enough here.
  #
  # SEPARATE FROM `linux-lto-tests` RATHER THAN A MATRIX ARM OF IT, because that
  # job now runs in a container and `container:` is a per-job key. Two jobs are
  # also two independent results: a red Clang arm cannot hide a GCC one.
  # -------------------------------------------------------------------------
  linux-lto-clang:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANABASIS_CLANG_VERSION }}

      - name: Assert the pinned Clang major
        run: |
          set -eu
          clang++-${ANABASIS_CLANG_VERSION} --version | head -1
          cmake --version | head -1
          ninja --version
          got="$(clang++-${ANABASIS_CLANG_VERSION} -dumpversion)"
          if [ "${got%%.*}" != "${ANABASIS_CLANG_VERSION}" ]; then
            echo "::error::clang++-${ANABASIS_CLANG_VERSION} reports ${got}; the pin declares major ${ANABASIS_CLANG_VERSION}"
            exit 1
          fi

      # Its own lineage. `-flto` under Clang emits LLVM bitcode, which shares no
      # cache entries with `linux`'s native objects even though both are clang-22.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-lto-${{ github.run_id }}
          restore-keys: ccache-ubuntu-clang${{ env.ANABASIS_CLANG_VERSION }}-lto-

      # lld links this one -- `setup-llvm-apt.sh` installs the version-matched
      # `lld-<major>` beside the compiler and `CMakeLists.txt` probes for it,
      # which is the same arrangement the shipped plugin's LTO link depends on.
      - name: Configure (Clang, -flto on the test suites)
        run: |
          ccache --zero-stats || true
          cmake -B build-lto -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${ANABASIS_CLANG_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${ANABASIS_CLANG_VERSION} \
            -DCMAKE_C_FLAGS="-flto" \
            -DCMAKE_CXX_FLAGS="-flto" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto" \
            -DANABASIS_BUILD_STANDALONE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }} \
            -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Warning-gate self-test (the classifier still classifies)
        run: python3 scripts/check-clang-warnings.py --self-test

      # Close to a duplicate of `linux`'s gate -- same compiler, same sources;
      # `-flto` changes codegen, not front-end diagnostics -- and kept because it
      # costs a `tee` and because a gate that only ever runs elsewhere is one
      # this job's silence cannot be read against.
      - name: Build the suites (LTO), gating on first-party warnings
        run: |
          set -o pipefail
          cmake --build build-lto --target AnabasisTests AnabasisStateTests 2>&1 | tee clang-lto-build.log
          python3 scripts/check-clang-warnings.py \
            --log clang-lto-build.log \
            --root "${GITHUB_WORKSPACE}" \
            --build-dir "${GITHUB_WORKSPACE}/build-lto" \
            --compiler "clang++-${ANABASIS_CLANG_VERSION}"

      # THE POINT OF THE JOB. Same assertions, different codegen: whatever the
      # optimiser is entitled to do across translation units, it has to leave
      # every one of them true.
      - name: Self-tests against LTO codegen
        env:
          MALLOC_PERTURB_: 255      # see the `linux` job's self-test step
        run: |
          ./build-lto/AnabasisTests_artefacts/Release/AnabasisTests
          ./build-lto/AnabasisStateTests_artefacts/Release/AnabasisStateTests

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

  # -------------------------------------------------------------------------
  # RealtimeSanitizer (ADR-0029) -- the FIRST mechanical detector this repository
  # has had for its Priority-1 policy. `REALTIME_AUDIO_POLICY.md` forbids
  # allocation, locking and blocking on the audio thread; ASan, UBSan and
  # valgrind all treat an audio-path `malloc` as perfectly correct code, so
  # until 0.2.0 the rule was enforced by review and by a hand-written audit.
  #
  # ITS OWN JOB, AND THAT IS FORCED RATHER THAN CHOSEN. The Clang driver rejects
  # `-fsanitize=realtime` combined with `address`, `undefined`, the
  # `sanitizers` job's actual `address,undefined` set, or `thread`: RTSan needs
  # its own binary, so it needs its own build directory and its own job.
  #
  # DEFAULT `RTSAN_OPTIONS`, DELIBERATELY UNSET. RTSan halts on the first
  # violation by default and exits 43. The one setting that would break this
  # gate is `halt_on_error=false`, under which the process PRINTS violations and
  # still exits 0 -- a step that reports and passes, which TESTING_POLICY rule 4
  # is written against. Do not configure it.
  #
  # ONLY `AnabasisTests` RUNS HERE. `AnabasisStateTests` drives the wrapper, but
  # its audio-path coverage is a handful of blocks; the DSP suite is where the
  # chain is exercised across the whole feature matrix, and a runtime tool's
  # value is proportional to path coverage.
  #
  # THE ALLOCATION GUARD STANDS ITSELF DOWN IN THIS BUILD, and must: its
  # `operator new`/`malloc` definitions take precedence over RTSan's own
  # interceptors and would blind the lane. `tests/AllocationGuard.h` detects
  # `__has_feature(realtime_sanitizer)` for that, and `-DANABASIS_RTSAN_LANE=1`
  # below states the same fact from outside the compiler so the two cannot drift
  # apart -- if the feature test ever stops firing, the BUILD fails with an
  # #error naming the reason instead of the lane going quietly blind.
  # -------------------------------------------------------------------------
  realtime:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RTSan's runtime ships in `libclang-rt-<major>-dev` from apt.llvm.org.
      # Ubuntu's own archives carry no `libclang_rt.rtsan` for this major at all,
      # so the pin is a hard requirement here rather than a preference.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANABASIS_CLANG_VERSION }}

      # THE COMPILER CACHE (0.2.0). Every Linux job here previously fetched and
      # compiled JUCE from scratch on every push -- four full builds of a
      # dependency that changes only when its pinned SHA does. ccache is keyed on
      # preprocessed source and the compiler's identity, so a JUCE bump or a
      # compiler pin change invalidates it correctly by construction.
      #
      # AN OPTIMIZATION, NEVER A REQUIREMENT. The composite action publishes an
      # EMPTY `ANABASIS_COMPILER_LAUNCHER` if ccache cannot be installed, and the
      # configure step below passes it through unset -- slower, never different.
      # A cache hit changes where the .o files came from, never what they
      # contain.
      #
      # THE LINEAGE IS PER JOB and stays here rather than in the action, because
      # it is the part that is genuinely different in each: which compiler
      # produced the objects, and which build directory. `github.run_id` in the
      # key makes every run write a fresh entry; `restore-keys` is what makes it
      # read the previous one.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-realtime-clang${{ env.ANABASIS_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-realtime-clang${{ env.ANABASIS_CLANG_VERSION }}-


      # PROVE THE LANE CAN FAIL BEFORE TRUSTING ITS SILENCE (TESTING_POLICY
      # rule 5). Compiled standalone -- it needs no JUCE and no project
      # configuration, which is why it is not a CMake target.
      #
      # TWO assertions, and the second is not caution. A non-zero exit alone is
      # satisfied by a canary that died for an unrelated reason, so the report
      # SIGNATURE is checked too. The canary's own failure message deliberately
      # avoids that token; an earlier draft of this pattern in the sibling
      # product carried it and made a dead lane report itself live.
      - name: RealtimeSanitizer liveness canary (the lane must be able to fail)
        run: |
          set -euo pipefail
          clang++-${ANABASIS_CLANG_VERSION} -std=c++23 -O2 -fsanitize=realtime \
            -fno-omit-frame-pointer tests/realtime_canary.cpp -o rtsan-canary
          set +e
          ./rtsan-canary > canary.log 2>&1
          RC=$?
          set -e
          cat canary.log
          if [ "$RC" -eq 0 ]; then
            echo "::error::the RealtimeSanitizer canary exited 0 -- this lane is instrumenting nothing"
            exit 1
          fi
          if ! grep -q "ERROR: RealtimeSanitizer" canary.log; then
            echo "::error::the canary aborted, but not with a RealtimeSanitizer report -- it died for some other reason"
            exit 1
          fi

      # THE COMPILE-TIME TIER, over the JUCE-free leaf layer only. Compiled
      # TWICE: clean, then with the seeded violation, because a clean compile is
      # also what a dead gate prints. `-Werror=unknown-warning-option` makes a
      # renamed flag fail by name on the first compile; the canary compile
      # catches the case the option name cannot -- still accepted, no longer
      # implemented.
      - name: Realtime effect diagnostics (first-party leaf layer)
        run: |
          set -euo pipefail
          EFFECTS_FLAGS="-std=c++23 -O2 -I src -I src/dsp
                         -Werror=unknown-warning-option -Werror=function-effects"
          echo "clean compile -- must succeed with no diagnostics"
          clang++-${ANABASIS_CLANG_VERSION} $EFFECTS_FLAGS -fsyntax-only tests/realtime_effects.cpp
          echo "canary compile -- must FAIL with a -Wfunction-effects diagnostic"
          set +e
          clang++-${ANABASIS_CLANG_VERSION} $EFFECTS_FLAGS -DANABASIS_EFFECTS_CANARY \
            -fsyntax-only tests/realtime_effects.cpp > effects-canary.log 2>&1
          RC=$?
          set -e
          cat effects-canary.log
          if [ "$RC" -eq 0 ]; then
            echo "::error::the function-effects canary COMPILED -- the diagnostic is not being applied"
            exit 1
          fi
          if ! grep -q -- "-Wfunction-effects" effects-canary.log; then
            echo "::error::the function-effects canary failed, but not with a -Wfunction-effects diagnostic"
            exit 1
          fi

      - name: Configure (Clang, RealtimeSanitizer)
        run: >
          cmake -B build-rt -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANABASIS_CLANG_VERSION }}
          -DCMAKE_C_FLAGS="-fsanitize=realtime -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=realtime -fno-omit-frame-pointer -DANABASIS_RTSAN_LANE=1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=realtime"
          -DANABASIS_BUILD_STANDALONE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build the DSP suite (RealtimeSanitizer)
        run: cmake --build build-rt --target AnabasisTests

      # No RTSAN_OPTIONS: see the job comment. A violation anywhere in the
      # chain aborts here with a symbolized stack and exit 43.
      - name: DSP self-tests under RealtimeSanitizer
        run: ./build-rt/AnabasisTests_artefacts/RelWithDebInfo/AnabasisTests

  windows:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default Visual Studio generator (multi-config); MSVC is auto-detected.
      - name: Configure
        id: configure
        run: cmake -B build -DANABASIS_BUILD_PROBE=ON -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      # RECORD THE TOOLCHAIN THAT BUILT THE SHIPPED WINDOWS BYTES (0.2.2).
      # `windows-latest` floats and MSVC is auto-detected, so until this step
      # nothing in the run said which toolset it resolved to -- a released .vst3
      # could be built by a compiler no artifact names. Linux pins its compiler
      # (ADR-0032) and macOS records its slices; this is the Windows half of the
      # same property, and it is a RECORD plus one narrow assertion rather than a
      # pin, because MSVC cannot be installed the way apt.llvm.org's Clang can.
      #
      # WHAT IS ASSERTED is deliberately narrow: the ABI SERIES (`14.x`), which
      # is what decides which Visual C++ redistributable a user needs. Patch and
      # minor moves inside 14.x are ABI-compatible by Microsoft's own contract
      # and pass silently; a move off 14.x is a compatibility claim this
      # repository has to re-take, so it fails.
      - name: Record + assert the MSVC toolset
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'build/CMakeCache.txt'

          # Two cache keys are tried because which of them carries a full path is
          # a property of the GENERATOR, not of this project, and the VS
          # generator is the one CMake documents least precisely here. Whichever
          # yields a `...\VC\Tools\MSVC\<version>\...` component wins.
          $version = $null
          foreach ($key in 'CMAKE_CXX_COMPILER:FILEPATH', 'CMAKE_LINKER:FILEPATH') {
            $hit = (Select-String -Path $cache -Pattern ('^' + [regex]::Escape($key)) | Select-Object -First 1)
            if ($null -ne $hit -and $hit.Line -match 'MSVC[\\/]+([0-9]+(\.[0-9]+)+)') {
              $version = $Matches[1]
              break
            }
          }

          if ($null -eq $version) {
            # A WARNING, NOT A FAILURE. This step reports and asserts; it does not
            # build or validate anything a user receives, and reddening the
            # Windows release gate because a cache key moved would be a footnote
            # deciding whether a release ships. The message names what to read.
            Write-Host "::warning::Could not read an MSVC toolset version from $cache (looked at CMAKE_CXX_COMPILER and CMAKE_LINKER). The Windows toolchain is unrecorded for this run."
            Select-String -Path $cache -Pattern 'CMAKE_(CXX_COMPILER|LINKER):FILEPATH='
            exit 0
          }

          $series = $version.Split('.')[0]
          Write-Host "MSVC toolset $version (ABI series $series.x)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "MSVC toolset ``$version`` (ABI series ``$series.x``)"

          if ($series -ne '14') {
            Write-Host "::error::MSVC ABI series moved from 14.x to $series.x, which changes the Visual C++ redistributable users need. Confirm the new requirement, update COMPATIBILITY_MATRIX.md, and raise this assertion in the same change."
            exit 1
          }

      - name: Build (VST3 + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      - name: Self-tests (DSP + state)
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exactly ONE match -- like the staging step below, and like
          # scripts/run-tests.sh. NOT `Select-Object -First 1`: Windows uses the
          # multi-config Visual Studio generator, so a tree ever built in more than
          # one configuration holds several AnabasisTests.exe, and taking whichever
          # enumerates first could run a Debug binary while the artifacts come from
          # Release -- a green gate reporting on the wrong build.
          function Get-OneTestExe {
            param([Parameter(Mandatory)][string]$Name)
            # -ErrorAction SilentlyContinue for the same reason as
            # scripts/run-pluginval.ps1: $ErrorActionPreference is 'Stop', so a
            # missing build/ would make Get-ChildItem THROW and the intended
            # "build first" message below would be unreachable -- the operator
            # would get a .NET stack trace instead of the one-line fix. In CI this
            # step only runs after a successful build, so it is a diagnostics gap
            # rather than a functional one; it is fixed for consistency, because
            # two discovery sites behaving differently is what invites the next bug.
            $found = @(Get-ChildItem -Recurse -Path build -Filter $Name -File -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { Write-Error "$Name not found under build -- build first" }
            if ($found.Count -ne 1) {
              Write-Error ("$Name is ambiguous -- found " + $found.Count + ": " + ($found.FullName -join ', ') +
                           " -- refusing to guess which one the gate should run")
            }
            return $found[0]
          }
          # Locate BOTH before running either, so an ambiguous tree fails before any
          # test output invites a partial reading.
          $exe = Get-OneTestExe -Name AnabasisTests.exe
          $stateExe = Get-OneTestExe -Name AnabasisStateTests.exe
          $ErrorActionPreference = 'Continue'
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $stateExe.FullName

      - name: Channel probe (hosts the built VST3)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # FAIL CLOSED, exactly as `scripts/run-pluginval.ps1` does, and for the
          # same two reasons it spells out. windows-latest uses the multi-config
          # Visual Studio generator, so several configurations of Anabasis.vst3
          # genuinely coexist in one build tree — `Select-Object -First 1` would
          # let this gate report green about a Debug or leftover bundle while the
          # uploaded artifacts come from Release.
          #
          # `-Directory` is the second half and is specific to Windows: the VST3
          # BUNDLE directory is named Anabasis.vst3 and the module inside it is
          # ALSO named Anabasis.vst3
          # (…/Anabasis.vst3/Contents/x86_64-win/Anabasis.vst3), so an unfiltered
          # -Filter matches a directory and a file and only enumeration order
          # decides which one the probe is handed.
          #
          # -ErrorAction SilentlyContinue with $ErrorActionPreference = 'Stop':
          # without it a missing build/ makes Get-ChildItem THROW, and the
          # operator gets a stack trace where the count check below would have
          # printed the one-line cause.
          function Find-One {
            param([string]$Filter, [switch]$Directory, [string]$What)
            $found = @(Get-ChildItem -Recurse -Path build -Filter $Filter -Directory:$Directory -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { throw "$What not found under build/ -- nothing to probe" }
            if ($found.Count -ne 1) {
              $found | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "$What is ambiguous -- found $($found.Count) under build/. Refusing to guess which one the probe should exercise."
            }
            return $found[0]
          }
          $probe = Find-One -Filter AnabasisChannelProbe.exe -What 'AnabasisChannelProbe.exe'
          $vst3  = Find-One -Filter Anabasis.vst3 -Directory -What 'the Anabasis.vst3 bundle'
          & $probe.FullName $vst3.FullName --format vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} -Mode deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} -Mode randomise

      # Release links with /DEBUG (+/OPT:REF,ICF), so linker PDBs exist for the
      # shipped images. They are retained as a SEPARATE debug artifact for crash
      # symbolication and are actively removed from the public artifact.
      #
      # Customer-artifact safety: the order below is deliberate -- locate
      # everything BEFORE copying anything, purge every debug file from the
      # public copy IMMEDIATELY after the copy, and only then run steps that can
      # abort (PDB retention, validation). A failure at any point can therefore
      # never leave a symbol-bearing public artifact behind, and the upload below
      # is additionally gated on this step succeeding.
      #
      # PDB location: the linker does NOT necessarily drop each image's PDB
      # beside the shipped binary under the same name -- JUCE retargets
      # RUNTIME/LIBRARY_OUTPUT_DIRECTORY for the .vst3/.exe but PDB_OUTPUT_DIRECTORY
      # is never set, so /PDB: falls back to the target's own CMake binary
      # directory under $(TargetName). Rather than guess a path, the PDB is
      # identified from the authoritative source: the CodeView (RSDS)
      # debug-directory record MSVC embeds in the linked image itself, which
      # carries the PDB's exact link-time name and path.
      # Gated on the BUILD, not merely on `!cancelled()`: with a failed build there
      # is nothing to stage, and this step would fail a second time on "expected
      # exactly one Anabasis.vst3 bundle, found 0" -- a red step with nothing to do
      # with the real cause. `!cancelled()` still lets it run after a pluginval-only
      # failure, which is the behaviour worth keeping. (The Linux job needs no such
      # guard: its strip step has no `if:` at all, so it skips automatically.)
      - name: Stage Windows artifacts (VST3 + Standalone; PDBs separated)
        id: stage_windows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/Anabasis-Windows'
          $dbg  = 'dist/Anabasis-Windows-debug'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path $dbg  | Out-Null

          # Read the CodeView (RSDS) debug-directory record MSVC embeds in a
          # /DEBUG-linked PE image, returning the PDB path exactly as the linker
          # recorded it (or $null if the image carries no debug directory).
          function Get-EmbeddedPdbPath {
            param([Parameter(Mandatory)][string]$ImagePath)
            $bytes = [System.IO.File]::ReadAllBytes($ImagePath)
            if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Error "$ImagePath is not a valid PE image (missing MZ signature)"
            }
            # EVERY offset below is read OUT OF the image being parsed, so each one
            # is bounds-checked before it is used as an index. Without that, a
            # truncated or malformed file throws a raw .NET IndexOutOfRangeException
            # instead of the diagnosable Write-Error this function is written to
            # produce -- and the operator gets a stack trace where a one-line cause
            # was intended. Diagnostics quality, not correctness: these images come
            # from MSVC in this same job.
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or ($peOffset + 24) -gt $bytes.Length) {
              Write-Error "$ImagePath : e_lfanew ($peOffset) points outside the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
              Write-Error "$ImagePath is not a valid PE image (missing PE signature)"
            }
            $coffOffset = $peOffset + 4
            $numberOfSections = [BitConverter]::ToUInt16($bytes, $coffOffset + 2)
            $sizeOfOptionalHeader = [BitConverter]::ToUInt16($bytes, $coffOffset + 16)
            $optHeaderOffset = $coffOffset + 20
            $magic = [BitConverter]::ToUInt16($bytes, $optHeaderOffset)
            $dataDirOffset = $optHeaderOffset + $(if ($magic -eq 0x20B) { 112 } else { 96 })
            $debugEntryOffset = $dataDirOffset + (6 * 8)   # data-directory index 6 = Debug
            if (($debugEntryOffset + 8) -gt $bytes.Length) {
              Write-Error "$ImagePath : optional header / data directories run past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugRva  = [BitConverter]::ToUInt32($bytes, $debugEntryOffset)
            $debugSize = [BitConverter]::ToUInt32($bytes, $debugEntryOffset + 4)
            if ($debugRva -eq 0 -or $debugSize -eq 0) { return $null }
            # Map the debug directory's RVA to a file offset via the section table.
            $sectionTableOffset = $optHeaderOffset + $sizeOfOptionalHeader
            if (($sectionTableOffset + ($numberOfSections * 40)) -gt $bytes.Length) {
              Write-Error "$ImagePath : section table ($numberOfSections sections at $sectionTableOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugFileOffset = -1
            for ($i = 0; $i -lt $numberOfSections; $i++) {
              $s = $sectionTableOffset + ($i * 40)
              $vsize = [BitConverter]::ToUInt32($bytes, $s + 8)
              $vaddr = [BitConverter]::ToUInt32($bytes, $s + 12)
              $rawPtr = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($debugRva -ge $vaddr -and $debugRva -lt ($vaddr + [Math]::Max($vsize, 1))) {
                $debugFileOffset = $rawPtr + ($debugRva - $vaddr); break
              }
            }
            if ($debugFileOffset -lt 0) {
              Write-Error "$ImagePath : could not map the debug directory RVA to a file offset"
            }
            # Walk the IMAGE_DEBUG_DIRECTORY array (28 bytes/entry) for an
            # IMAGE_DEBUG_TYPE_CODEVIEW (2) entry carrying an RSDS record.
            $entryCount = [Math]::Floor($debugSize / 28)
            if (($debugFileOffset + ($entryCount * 28)) -gt $bytes.Length) {
              Write-Error "$ImagePath : debug directory ($entryCount entries at $debugFileOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            for ($i = 0; $i -lt $entryCount; $i++) {
              $e = $debugFileOffset + ($i * 28)
              $type = [BitConverter]::ToUInt32($bytes, $e + 12)
              $pointerToRaw = [BitConverter]::ToUInt32($bytes, $e + 24)
              if ($type -eq 2 -and $pointerToRaw -gt 0) {
                # Bounds-check before indexing: PointerToRawData comes from the
                # image being parsed, so a truncated or malformed file would
                # otherwise throw a raw .NET IndexOutOfRange instead of the
                # intended, diagnosable Write-Error. 28 = Signature(4) + GUID(16)
                # + Age(4), then at least one path byte.
                if ($pointerToRaw + 28 -gt $bytes.Length) {
                  Write-Error "$ImagePath : CodeView record at offset $pointerToRaw runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
                }
                $sig = [BitConverter]::ToUInt32($bytes, $pointerToRaw)
                if ($sig -eq 0x53445352) {   # 'RSDS'
                  # Signature(4) + GUID(16) + Age(4), then a NUL-terminated path.
                  $strStart = $pointerToRaw + 24
                  $strEnd = $strStart
                  while ($strEnd -lt $bytes.Length -and $bytes[$strEnd] -ne 0) { $strEnd++ }
                  return [System.Text.Encoding]::ASCII.GetString($bytes, $strStart, $strEnd - $strStart)
                }
              }
            }
            return $null
          }

          # 1) Locate everything first -- an abort here copies NOTHING public.
          #    Each locate demands EXACTLY ONE match: zero is a build-layout
          #    failure, more than one is ambiguity we refuse to guess about.
          # -ErrorAction SilentlyContinue: see the self-test step -- a missing build/
          # must produce the diagnostic below, not a terminating .NET error.
          $vst3 = @(Get-ChildItem -Recurse -Path build -Filter Anabasis.vst3 -Directory -ErrorAction SilentlyContinue)
          if ($vst3.Count -ne 1) { Write-Error "expected exactly one Anabasis.vst3 bundle, found $($vst3.Count)" }
          $vst3 = $vst3[0]
          $vst3Bin = @(Get-ChildItem -Recurse -Path $vst3.FullName -File | Where-Object { $_.Extension -eq '.vst3' })
          if ($vst3Bin.Count -ne 1) { Write-Error "expected exactly one .vst3 image inside $($vst3.FullName), found $($vst3Bin.Count)" }
          $vst3Bin = $vst3Bin[0]
          $exe = @(Get-ChildItem -Recurse -Path build -Filter Anabasis.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'Standalone' })
          if ($exe.Count -ne 1) { Write-Error "expected exactly one Standalone Anabasis.exe, found $($exe.Count)" }
          $exe = $exe[0]
          # 2) Copy the public artifact. Attribution is deliberately NOT staged
          #    (ADR-0021): NOTICE and THIRD_PARTY_LICENSES.md ship as
          #    version-named release-page assets. See the Linux stage step for
          #    the full reasoning — it is the same rule on all three platforms.
          Copy-Item -Recurse -Force $vst3.FullName $dist
          Copy-Item -Force $exe.FullName $dist
          Copy-Item -Force packaging\windows\INSTALL.txt $dist
          # 3) Purge ALL debug material from the public copy BEFORE any further
          #    step that can abort.
          Get-ChildItem -Recurse -Path $dist -File |
            Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' } |
            Remove-Item -Force
          # 4) Validate the PUBLIC copy and checkpoint it. Everything the customer
          #    artifact needs is done at this point, so `public_ok` is emitted HERE,
          #    before the developer-side PDB work below can abort. $GITHUB_OUTPUT is
          #    read after the step regardless of its outcome, so a later failure
          #    cannot retract it -- the same mechanism the macOS job already uses.
          #    Previously the customer upload gated on this whole step succeeding,
          #    which meant a purely developer-side symbol problem ALSO withheld the
          #    Windows beta artifact, even though the public copy was already
          #    assembled and purged. macOS treats that class of failure as
          #    best-effort, so the two platforms had opposite policies for it.
          #    WHAT THIS CHECK IS, PRECISELY: it re-lists the same extensions step 3
          #    just deleted, so it can only fire if Remove-Item silently failed. That
          #    is a DELETE-CONFIRMATION, not an independent property check, and it is
          #    weaker than the Linux equivalent (which inspects ELF section headers
          #    for .symtab and asserts the stripped .so still exports
          #    GetPluginFactory) and than macOS (which asserts both slices are
          #    present). Nothing here asserts the shipped .vst3 is still loadable.
          #    TODO(P1): add an independent assertion once there is a real binary to
          #    assert against -- the export table is the obvious property, and this
          #    job already parses PE headers for the CodeView record. Do NOT
          #    substitute a raw byte-string search for `GetPluginFactory`: matching
          #    the name anywhere in the file is not evidence that it is exported.
          $leak = Get-ChildItem -Recurse -Path $dist -File |
                  Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' }
          if ($leak) { Write-Error ("customer artifact contains debug files: " + ($leak.FullName -join ', ')) }
          "public_ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # 5) Retain each shipped image's linker PDB, identified via its embedded
          #    CodeView record. DELIBERATELY STRICT, unlike the macOS dSYM capture:
          #    there, a missing dSYM is an EXPECTED consequence of Release+LTO; here
          #    /DEBUG guarantees a PDB, so its absence means the build or this logic
          #    is wrong and must be seen. The strictness now costs only the -debug
          #    artifact, which is what it is actually protecting.
          foreach ($img in @(@{ tag = 'vst3'; bin = $vst3Bin }, @{ tag = 'standalone'; bin = $exe })) {
            $recordedPdbPath = Get-EmbeddedPdbPath -ImagePath $img.bin.FullName
            if (-not $recordedPdbPath) {
              Write-Error ("no CodeView debug-directory entry embedded in " + $img.bin.FullName +
                           " -- expected one because Release links with /DEBUG (CMakeLists.txt AnabasisHardening); " +
                           "debug artifact would be wrong/incomplete")
            }
            $pdbName = Split-Path -Leaf $recordedPdbPath
            $pdbFile = $null
            if (Test-Path -LiteralPath $recordedPdbPath -PathType Leaf) {
              $pdbFile = Get-Item -LiteralPath $recordedPdbPath
            } else {
              $candidates = @(Get-ChildItem -Recurse -Path build -Filter $pdbName -File)
              if ($candidates.Count -ne 1) {
                Write-Error ("PDB '" + $pdbName + "' (recorded in " + $img.bin.FullName + "'s debug info at link " +
                             "time) not found uniquely under build/ -- found " + $candidates.Count +
                             " -- debug artifact would be wrong/incomplete")
              }
              $pdbFile = $candidates[0]
            }
            Copy-Item -Force $pdbFile.FullName (Join-Path $dbg ("Anabasis." + $img.tag + ".pdb"))
          }
          # Written LAST, for the same reason as the Linux strip step: $dbg is
          # created at the top of this step, so gating the debug upload on "this
          # step was not skipped" would fire it against an empty directory when the
          # step aborts before the PDB copies -- a second, misleading failure on
          # if-no-files-found on top of the real one.
          # -Encoding utf8 is explicit: the runner uses pwsh 7 (UTF-8 by default),
          # but Windows PowerShell 5.1 would write UTF-16LE and the runner would
          # not parse the output at all.
          "debug_artifacts=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The Inno Setup installer is built FROM the staged payload, so it gates
      # on the same `public_ok` checkpoint the customer zip does: repacking a
      # tree that failed validation would launder a rejected build into an
      # installer. ISCC ships preinstalled on windows-latest.
      - name: Package Windows installer (Inno Setup)
        id: package_windows
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage_windows.outputs.public_ok == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The version comes from CMakeLists.txt, the single source
          # release.yml also validates the tag against — never from a workflow
          # literal, which is the copy that goes stale on the next bump.
          $m = Select-String -Path CMakeLists.txt -Pattern '^project\(Anabasis VERSION ([0-9]+\.[0-9]+\.[0-9]+) '
          if (-not $m) { Write-Error 'could not read the version from CMakeLists.txt' }
          $version = $m.Matches[0].Groups[1].Value
          $staging = (Resolve-Path 'dist/Anabasis-Windows').Path
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$version" "/DStagingDir=$staging" '/Odist' 'packaging/windows/Anabasis.iss'
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE" }
          $out = "dist/Anabasis-$version-Windows-Installer.exe"
          if (-not (Test-Path $out)) { Write-Error "installer not produced at $out" }

      - name: Upload Windows installer
        if: ${{ !cancelled() && steps.package_windows.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-Windows-installer
          path: dist/Anabasis-*-Windows-Installer.exe
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage_windows.outputs.public_ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-Windows
          path: dist/Anabasis-Windows
          if-no-files-found: error

      - name: Upload Windows debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.stage_windows.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-Windows-debug
          path: dist/Anabasis-Windows-debug
          if-no-files-found: error

  macos:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    # Apple Silicon runner; we build a universal binary. FLOATING, like
    # `ubuntu-latest` and `windows-latest` above -- macOS was the one platform
    # pinned to a numbered image, and `macos-14` is now DEPRECATED upstream
    # (actions/runner-images: macos-14 / macos-14-xlarge, arm64, deprecated).
    # `macos-latest` resolves to macOS 26 arm64 today. The float is deliberate
    # and is NOT the JUCE-pin discipline being relaxed: the framework is pinned
    # because a silent bump can move DSP, latency and the state ABI, whereas the
    # runner image is the ENVIRONMENT this product is tested against, and letting
    # it age is how a toolchain regression reaches users first. The x86_64 half
    # of the universal build is covered on real hardware by `macos-intel` below,
    # which stays on a numbered Intel label because "latest" has no Intel meaning.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A BARE `brew install ... || true` SWALLOWS A GENUINE FAILURE, so each tool
      # is followed by the check that proves it is usable. ninja is preinstalled
      # on this image, which is what makes `|| true` safe for it; ccache is not,
      # and it is an OPTIMIZATION rather than a requirement -- so a brew hiccup
      # publishes an empty launcher and the job builds slower, never differently.
      - name: Install build tools
        run: |
          brew install ninja || true
          ninja --version
          cmake --version | head -1
          if brew install ccache && ccache --version; then
            echo "ANABASIS_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache unavailable -- building without the compiler cache"
            echo "ANABASIS_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          fi

      # THE macOS JOBS ARE CACHED (0.2.2), and BOTH halves of that decision are
      # now measured HERE rather than inherited. This workflow used to say the
      # macOS jobs were "deliberately NOT cached" because `dsymutil` walks the
      # debug map back to the object files -- but a cached object IS a real `.o`
      # at the path the linker recorded, so the packaging step's walk reads the
      # same files it always read, whoever compiled them.
      #
      # THE UNIVERSAL-BUILD QUESTION, ANSWERED WITH THIS REPOSITORY'S NUMBERS
      # (0.2.4). A review raised the right objection: ccache has historically
      # REFUSED to cache a compilation carrying more than one `-arch`, and this
      # job hands it two at once (`CMAKE_OSX_ARCHITECTURES="arm64;x86_64"` is
      # one clang invocation with both, not two invocations). If that still held
      # here, the cache would be inert and the restore/save would be pure cost.
      # It does not hold. `macos-latest` installs ccache 4.13.6, and across
      # three consecutive runs this job reports:
      #
      #     Cacheable calls:  182 / 182 (100.0%)      every run
      #     Hits (cold):       26 / 182 ( 14.29%)     run 32563814120
      #     Hits (warm):      174 / 182 ( 95.60%)     run 32565784751
      #     Hits (warm):      172 / 182 ( 94.51%)     run 32568563583
      #
      # 182/182 is the whole answer: ccache classifies every multi-`-arch`
      # compilation as cacheable and declines none of them. Only that line is
      # positive evidence -- the absence of an `Uncacheable` section is just
      # ccache omitting an empty section, not a second witness. The object count
      # is 182 in every run because only `.ccache` is restored and never
      # `build/`, so ninja always issues all 182 invocations: the drop is cache
      # hits, not an incremental build.
      #
      # QUOTE THE COMPILE PHASE, NOT THE STEP TOTAL. Splitting each build step
      # at `Stats updated` (the moment ccache's counters stop moving) separates
      # what the cache acts on from what it cannot touch:
      #
      #                    step total    compile     LTO link
      #     cold             631s          501s        130s
      #     warm 32565784751 233s           46s        187s
      #     warm 32568563583 370s           86s        284s
      #
      # The compile phase -- the only part ccache can affect -- falls 501s ->
      # 46-86s, a 415-455s saving of 83-91%, and it is consistent across both
      # warm runs. The step TOTAL says 261-398s (41-63%), a far wider spread,
      # because it also carries an LTO link that drifted 130s -> 187s -> 284s
      # between runs on a phase ccache never sees. Quoting a single step-total
      # figure means quoting the better of two samples and attributing link
      # variance to the cache; this block deliberately does not.
      #
      # And the honest proportion: this job IS the run's critical path (18m43s,
      # the longest in the matrix), but 12m34s of that is the four pluginval
      # passes and only 3m53s is the build step ccache acts on. The figure this
      # comment used to quote -- "the sibling measured 29m44s with 16m40s of it
      # building" -- is the SIBLING's job, not this one, and 16m40s overstates
      # this repository's build step by about 4x. Kept because 397s of real
      # saving on the critical path is worth a restore and a save; quoted now
      # from measurements taken here.
      #
      # The `lipo` slice assertion this job already carries is the backstop
      # against a thin object ever reaching a universal artifact.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-universal-${{ github.run_id }}
          restore-keys: ccache-macos-universal-

      # CMAKE_OSX_DEPLOYMENT_TARGET=10.13 — DELIBERATE (OQ-011, resolved at P1).
      # JUCE 9's documented deployment floor is macOS 10.11 (pinned tree,
      # README "Deployment Targets"), so 10.13 sits above it; it matches the
      # sibling product, keeping one support claim across the family. The value
      # governs the x86_64 slice; the arm64 slice floors at 11.0 by toolchain
      # regardless. Supported-OS claim: macOS 10.13+ (Intel), 11.0+ (Apple
      # Silicon) — restated in docs/architecture/COMPATIBILITY_MATRIX.md, which
      # landed 2026-08-05 (this comment asked for it "when that document lands
      # (P2)"; it arrived later than that target). The first macOS CI run is the
      # warning-free check on this value.
      #
      # This note lives OUTSIDE the `run:` scalar deliberately. In a YAML folded
      # block (`run: >`) every line is joined into ONE shell line and `#` has no
      # YAML meaning, so an inline comment there silently swallows every argument
      # after it -- which is exactly what happened to the two flags below before
      # this was moved out.
      - name: Configure (universal arm64 + x86_64)
        run: >
          ccache --zero-stats || true &&
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DANABASIS_BUILD_PROBE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + AU + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      # Cached objects are real .o files at the paths the linker recorded, so the
      # packaging step's `dsymutil` walk is unaffected -- it reads the same object
      # files it always read, whoever compiled them.
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      # HALF ONE OF THE SYMBOLICATION CONTRACT (0.2.0). `CMakeLists.txt` gives
      # ld64 `-object_path_lto,<dir>` so the LTO codegen objects SURVIVE the
      # link -- without them `dsymutil` has a debug map pointing at deleted
      # temporaries and produces a dSYM with no DWARF. An empty directory here
      # means one of two things and both need a human: LTO did not run (so the
      # shipped bytes are not what ADR-0008 says they are), or the flag stopped
      # taking effect (so symbolication is silently gone again). Neither may
      # pass as a warning.
      #
      # A UNIVERSAL BUILD LINKS ONCE PER SLICE and there are several LTO-linked
      # targets, so several objects are expected -- and "expected" was doing no
      # work here until 0.2.5, because the assertion only tested COUNT -eq 0.
      # It read 1 and passed, on a build that should have retained one object
      # per (target x architecture). Every link was writing to the same path and
      # overwriting the last, so the single survivor was one target's x86_64
      # object; the arm64 slice of every bundle had NO retained object, hence no
      # DWARF, hence no usable arm64 dSYM -- while the aggregate checks
      # downstream still reported success. See ADR-0035.
      #
      # The assertion is now on ARCHITECTURE COVERAGE rather than on a count.
      # A count is brittle (it tracks the target list, which options change) and
      # it was not what mattered; what mattered is that EVERY architecture this
      # build produces has at least one retained LTO object to symbolicate from.
      # That is the property that was violated, so that is the property gated.
      - name: Assert LTO ran and its objects were retained
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          COUNT="$(find build/lto-objects -type f | wc -l | tr -d ' ')"
          echo "retained LTO objects: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::build/lto-objects is empty -- either -flto did not run on the shipped targets, or -Wl,-object_path_lto stopped taking effect. macOS crash symbolication depends on these objects; do NOT resolve this by disabling LTO."
            exit 1
          fi
          # Which architectures the shipped bundle actually carries, read off the
          # artifact rather than assumed from the configure line.
          SHIPPED="build/Anabasis_artefacts/Release/VST3/Anabasis.vst3/Contents/MacOS/Anabasis"
          ARCHES="$(lipo -archs "$SHIPPED")"
          echo "shipped architectures: $ARCHES"
          MISSING=""
          for A in $ARCHES; do
            FOUND=0
            for O in build/lto-objects/*; do
              [ -f "$O" ] || continue
              if lipo -archs "$O" 2>/dev/null | tr ' ' '\n' | grep -qx "$A"; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -eq 1 ]; then
              echo "  $A: retained LTO object present"
            else
              echo "  $A: NO retained LTO object"
              MISSING="$MISSING $A"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::no retained LTO object covers:$MISSING -- dsymutil will find no DWARF for those slices and the shipped bundle will not be debuggable on them. The usual cause is several links sharing one -Wl,-object_path_lto path and overwriting each other; CMakeLists.txt gives each (target, architecture) its own file for exactly this reason. Do NOT resolve this by disabling LTO or by relaxing this assertion."
            exit 1
          fi

      - name: Self-tests (DSP + state)
        id: tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-tests.sh

      # ...AND THE OTHER SLICE. The runner is Apple Silicon and the product is a
      # UNIVERSAL binary, so the step above executes arm64 only: until this step
      # existed the x86_64 slice was compiled on every push and run by nothing,
      # on any platform. Half the macOS user base was validated by compilation
      # alone — and "does it behave the same on the other architecture" is
      # exactly the question a platform-specific field report asks.
      #
      # Rosetta 2 runs it in place, so this costs one extra execution of two
      # console apps rather than another runner. If Rosetta is absent the step
      # does NOT quietly pass: it emits a ::warning:: naming the coverage that
      # was lost, because a gate that silently does nothing is the failure this
      # workflow keeps having to relearn. It is a warning rather than an error
      # only because Rosetta's presence is the IMAGE's property, not the
      # product's, and a green product should not go red for it.
      - name: Self-tests, x86_64 slice under Rosetta
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 unavailable on this image -- the x86_64 slice was BUILT but NOT EXECUTED; Intel coverage for this run is compilation only"
            exit 0
          fi
          ANABASIS_TEST_RUNNER="arch -x86_64" ./scripts/run-tests.sh

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must have
        # succeeded for the binary to be in the state we intend to validate. The
        # implicit self-skip made the two modes behave differently after an earlier
        # failure -- the opposite of "both modes report independently".
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic vst3

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is what
        #     `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} randomise vst3

      # THE AU IS VALIDATED TOO, and only here -- it is the one format that
      # exists on exactly one platform. Until 2026-08-10 the release gate ran
      # against the VST3 alone on all three OSes, so the AU shipped to Logic
      # users having passed no automated validation at all. KI-009 is reported
      # in AU *and* VST3, which is what made the omission worth closing rather
      # than noting: the format the report names was the ungated one.
      #
      # Same strictness (the env block above is still the only copy), same two
      # modes, same 3 consecutive passes -- an AU that only passes sometimes is
      # not a passing AU. Gated on the BUILD like every other validation step,
      # never on the VST3 steps: a VST3 failure must not hide the AU's result.
      # INSTALL THE AU BEFORE VALIDATING IT, deliberately, and not as belt-and-braces.
      # macOS resolves Audio Units through the AudioComponent registry
      # (`AudioComponentFindNext`, which is what JUCE's AudioUnitPluginFormat calls),
      # and the registry only knows about bundles under a Components directory. A
      # freshly built .component sitting in the build tree can therefore report ZERO
      # plugin types however correct it is — which would make this gate red for an
      # environmental reason, or (worse, if pluginval ever treats "no types" as
      # nothing to do) green without validating anything. Installing first removes
      # the question instead of depending on the answer.
      #
      # `killall AudioComponentRegistrar` forces the registry to re-scan rather than
      # serve a cached list; it is `|| true` because the daemon may simply not be
      # running yet on a fresh runner, which is not a failure. The copy itself is
      # NOT `|| true`.
      - name: Install the AU so the AudioComponent registry can find it
        id: au_install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DEST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DEST"
          rm -rf "$DEST/Anabasis.component"
          cp -R build/Anabasis_artefacts/Release/AU/Anabasis.component "$DEST/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "bundle=$DEST/Anabasis.component" >> "$GITHUB_OUTPUT"
          ls -d "$DEST/Anabasis.component"

      - name: pluginval AU (deterministic x3 -- release gate)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.au_install.outcome == 'success' }}
        env:
          ANABASIS_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic au

      - name: pluginval AU (randomise x3 -- release gate)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.au_install.outcome == 'success' }}
        env:
          ANABASIS_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} randomise au

      # THE KI-009 PROBE -- the only step here that tests the artefact a USER
      # installs rather than a rebuild of its sources. `AnabasisStateTests`
      # drives the real processBlock, but compiled into a console app: no LTO
      # (ADR-0008 keeps the flags target on the plugin alone), no format wrapper,
      # one architecture. The probe LOADS the built bundle through
      # juce_audio_processors, so host -> wrapper -> processBlock -> engine ->
      # output is the shipped code path including whatever the optimiser did to
      # it, and its oracle is the field report's own question: is there audio on
      # BOTH channels. Exit 2 = could not load/configure (environment); exit 1 =
      # a channel was actually lost. Different codes on purpose.
      #
      # FOUR RUNS on macOS: both formats x both slices. The report names AU and
      # VST3 alike, and the x86_64 slice ships in the same universal binary while
      # being executed by nothing until this workflow started running it -- so
      # "macOS is green" previously meant one of the four.
      # One second, and it separates "the DSP core is wrong" from "the wrapper
      # is wrong" before the probe below reports at all — the distinction that
      # took KI-009 nine rounds to establish by inference.
      - name: Engine reproduction (no wrapper, no format, no host)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./build/AnabasisEngineRepro_artefacts/Release/AnabasisEngineRepro

      # TWO STEPS, NOT ONE, and the split is the same principle the pluginval
      # steps above already state: neither format may hide the other's result.
      # Combined, this step had to be gated on `au_install`, so an AU copy that
      # failed for its own reasons -- no AU built, an unwritable Components
      # directory -- suppressed the VST3 probe as well, and the run reported
      # nothing about a format that was sitting there ready to be tested. The
      # VST3 half is gated on the BUILD; the AU half on the INSTALL it genuinely
      # needs.
      - name: Channel probe -- VST3, both slices
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          PROBE=./build/AnabasisChannelProbe_artefacts/Release/AnabasisChannelProbe
          VST3=build/Anabasis_artefacts/Release/VST3/Anabasis.vst3
          echo "== arm64 / VST3 =="; "$PROBE" "$VST3" --format vst3
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "== x86_64 / VST3 =="; arch -x86_64 "$PROBE" "$VST3" --format vst3
          else
            echo "::warning::Rosetta 2 unavailable -- the x86_64 VST3 slice was probed by nothing this run"
          fi

      - name: Channel probe -- AU, both slices
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.au_install.outcome == 'success' }}
        run: |
          set -e
          PROBE=./build/AnabasisChannelProbe_artefacts/Release/AnabasisChannelProbe
          AU="$HOME/Library/Audio/Plug-Ins/Components/Anabasis.component"
          echo "== arm64 / AU   =="; "$PROBE" "$AU" --format au
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "== x86_64 / AU   =="; arch -x86_64 "$PROBE" "$AU" --format au
          else
            echo "::warning::Rosetta 2 unavailable -- the x86_64 AU slice was probed by nothing this run"
          fi


      # Order matters -- 1) dsymutil captures a universal dSYM per bundle (the
      # only crash-symbolication source once stripped), 2) strip -x removes local
      # symbols, 3) codesign LAST (stripping after signing would invalidate the
      # seal). Signing and slice verification are NOT '|| true': a failure must
      # fail the job, not silently ship a broken artifact.
      #
      # dsymutil WARNINGS ARE NOT FATAL. Under Release + LTO the DWARF the linked
      # binary references lives in the linker's TEMPORARY LTO object, already
      # deleted when dsymutil runs; dsymutil then warns, exits 0, and emits a
      # dSYM without usable DWARF. That is an expected property of the build
      # configuration, not a broken customer artifact. dSYM capture is therefore
      # BEST-EFFORT and judged on its OUTPUT, never on warning text: a produced
      # dSYM is kept only if its DWARF payload exists, its UUID set matches the
      # binary's slices exactly, and it carries at least one DWARF compile unit;
      # anything else is discarded with a ::warning:: and packaging CONTINUES.
      # The customer pipeline (strip -x -> codesign -> verify) is never blocked by
      # debug-capture problems.
      #
      # SINCE 0.2.0 THE CAPTURE IS EXPECTED TO SUCCEED. The LTO objects are
      # persisted via `-Wl,-object_path_lto` (CMakeLists.txt carries the full
      # reasoning), so `dsymutil` can follow the debug map back to real files.
      # The validity tests below are unchanged and still discard anything that
      # fails them -- what changed is what a discard MEANS. It used to be the
      # expected outcome of Release+LTO; it is now a regression, and the
      # assertion at the end of this job says so rather than leaving a
      # ::warning:: nobody reads.
      # Gated on the BUILD (see the Windows staging step): with a failed build
      # `strip -x` would run against a nonexistent binary and fail a second time.
      - name: Package macOS plugins (VST3 + AU + Standalone)
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anabasis-macOS"
          DBG="dist/Anabasis-macOS-debug"
          mkdir -p "$DIST" "$DBG"
          VST3="build/Anabasis_artefacts/Release/VST3/Anabasis.vst3"
          AU="build/Anabasis_artefacts/Release/AU/Anabasis.component"
          APP="build/Anabasis_artefacts/Release/Standalone/Anabasis.app"
          USABLE_DSYMS=0
          for B in "$VST3" "$AU" "$APP"; do
            BIN="$B/Contents/MacOS/Anabasis"
            NAME="$(basename "$B")"
            DSYM="$DBG/$NAME.dSYM"
            # ---- Best-effort developer dSYM capture: nothing in this block may
            # abort the job -- failures degrade to a ::warning:: and the dSYM is
            # discarded. Customer-artifact steps are NOT gated on it.
            DSYM_OK=1
            BIN_UUIDS="$(dwarfdump --uuid "$BIN" | awk '{print $2}' | sort)" || BIN_UUIDS=""
            if [ -z "$BIN_UUIDS" ]; then
              echo "::warning::$NAME: cannot read Mach-O slice UUIDs -- a dSYM would be unvalidatable, skipping debug capture"
              DSYM_OK=0
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DSYMUTIL_LOG="$(mktemp)"
              if ! dsymutil "$BIN" -o "$DSYM" >"$DSYMUTIL_LOG" 2>&1; then
                cat "$DSYMUTIL_LOG"
                echo "::warning::$NAME: dsymutil failed -- continuing without a dSYM (best-effort debug capture)"
                DSYM_OK=0
              elif [ -s "$DSYMUTIL_LOG" ]; then
                # Informational only: usability is decided by validating the
                # OUTPUT below, never by the presence of dsymutil warnings.
                cat "$DSYMUTIL_LOG"
              fi
              rm -f "$DSYMUTIL_LOG"
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DWARF_FILE="$DSYM/Contents/Resources/DWARF/$(basename "$BIN")"
              if [ ! -s "$DWARF_FILE" ]; then
                echo "::warning::$NAME: dSYM has no (or an empty) DWARF payload -- discarding it (expected under Release+LTO)"
                DSYM_OK=0
              else
                DSYM_UUIDS="$(dwarfdump --uuid "$DWARF_FILE" | awk '{print $2}' | sort)" || DSYM_UUIDS=""
                # PER ARCHITECTURE, NOT AGGREGATE -- this is the 0.2.5 fix, and
                # the distinction is the whole defect. A universal dSYM carries a
                # UUID for every slice whether or not that slice has any DWARF,
                # so the UUID-set comparison below passes on a dSYM that is
                # empty for one architecture. The compile-unit count used to be
                # taken over the WHOLE fat file, so 39 units from x86_64 and 0
                # from arm64 summed to 39, cleared `-eq 0`, and the job printed
                # "validated dSYM captured (UUID-matched, 39 compile units)"
                # while arm64 crash logs were unsymbolicatable. Counting per
                # slice is what makes the claim mean what it says.
                ARCHES="$(lipo -archs "$BIN" 2>/dev/null || true)"
                CU_COUNT=0
                CU_SUMMARY=""
                THIN_ARCHES=""
                for A in $ARCHES; do
                  N="$(dwarfdump --arch="$A" --debug-info "$DWARF_FILE" 2>/dev/null | grep -c 'DW_TAG_compile_unit' || true)"
                  [ -n "$N" ] || N=0
                  CU_COUNT=$((CU_COUNT + N))
                  CU_SUMMARY="$CU_SUMMARY $A=$N"
                  [ "$N" -eq 0 ] && THIN_ARCHES="$THIN_ARCHES $A"
                done
                if [ "$DSYM_UUIDS" != "$BIN_UUIDS" ]; then
                  echo "::warning::$NAME: dSYM UUIDs do not match the binary's slices -- discarding the mismatched dSYM"
                  DSYM_OK=0
                elif [ -z "$ARCHES" ]; then
                  echo "::warning::$NAME: cannot enumerate the binary's architecture slices -- a per-slice DWARF check is impossible, discarding the unvalidatable dSYM"
                  DSYM_OK=0
                elif [ -n "$THIN_ARCHES" ]; then
                  echo "::warning::$NAME: dSYM carries NO DWARF compile units for:$THIN_ARCHES (per-slice units:$CU_SUMMARY) -- discarding it, because a dSYM that symbolicates only some slices of a universal binary is not a usable one"
                  DSYM_OK=0
                fi
              fi
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              USABLE_DSYMS=$((USABLE_DSYMS + 1))
              echo "$NAME: validated dSYM captured (UUID-matched; compile units per slice:$CU_SUMMARY)"
            else
              rm -rf "$DSYM"
            fi
            # ---- Customer artifact: stripping ALWAYS proceeds -- debug capture
            # problems never weaken or skip it.
            strip -x "$BIN"
          done
          if [ "$USABLE_DSYMS" -eq 0 ]; then
            echo "::warning::no usable dSYM was produced -- since 0.2.0 this is a REGRESSION, not the expected Release+LTO outcome: -Wl,-object_path_lto keeps the objects dsymutil needs, and the 'Assert LTO ran' step earlier in this job confirmed they exist. The assertion at the end of this job will fail the run; the customer artifacts are unaffected."
          fi
          # Written BEFORE codesign/copy/verification below so dSYMs captured
          # above still upload even if those later steps fail.
          echo "debug_artifacts=$([ "$USABLE_DSYMS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Ad-hoc codesign so macOS will load the bundles after quarantine removal.
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$APP"
          cp -R "$VST3" "$DIST/"
          cp -R "$AU"   "$DIST/"
          cp -R "$APP"  "$DIST/"
          # Attribution is deliberately NOT staged (ADR-0021): NOTICE and
          # THIRD_PARTY_LICENSES.md ship as version-named release-page assets.
          # See the Linux stage step for the full reasoning.
          cp packaging/macos/INSTALL.txt "$DIST/INSTALL.txt"
          # ASSERT both slices are present -- do not merely print them. `lipo -archs`
          # exits 0 for ANY valid Mach-O, including a thin one, so echoing its output
          # verifies nothing: an arm64-only build would ship labelled "universal" and
          # Intel users would get a plug-in that cannot load. Not hypothetical -- a
          # folded-scalar comment once swallowed the trailing configure flags in this
          # very workflow, and the same accident on -DCMAKE_OSX_ARCHITECTURES produces
          # exactly that thin build.
          for B in "$DIST/Anabasis.vst3/Contents/MacOS/Anabasis" \
                   "$DIST/Anabasis.component/Contents/MacOS/Anabasis" \
                   "$DIST/Anabasis.app/Contents/MacOS/Anabasis"; do
            ARCHES="$(lipo -archs "$B")"
            echo "== $B == $ARCHES"
            for WANT in arm64 x86_64; do
              case " $ARCHES " in
                *" $WANT "*) ;;
                *) echo "::error::$B is missing the $WANT slice (found: $ARCHES) -- not a universal binary"; exit 1 ;;
              esac
            done
          done
          # The stripped, signed plugin must still expose its VST3 entry point.
          nm -gU "$DIST/Anabasis.vst3/Contents/MacOS/Anabasis" | grep -q GetPluginFactory
          # The customer artifact must contain no debug material (parity with the
          # Linux/Windows staging self-checks).
          if find "$DIST" \( -name '*.dSYM' -o -name '*.debug' -o -name '*.pdb' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # NOTE: the artifact transport drops executable bits; a P6 release.yml
          # must restore them on Contents/MacOS/* before archiving the release
          # zip. The ad-hoc signature lives inside each Mach-O and in
          # Contents/_CodeSignature (ordinary files), so it survives the round
          # trip -- only the mode bits need restoring.

      # Built FROM the validated staged payload, exactly as the Windows
      # installer is: `packaging/macos/build-pkg.sh` copies the three bundles
      # into component roots and self-checks the result (identifiers,
      # customise-allowed, all three components pre-selected).
      - name: Package macOS installer (.pkg)
        id: package_macos
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.package.outcome == 'success' }}
        run: |
          set -e
          VERSION=$(sed -nE 's/^project\(Anabasis VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)
          [ -n "$VERSION" ] || { echo "::error::could not read the version from CMakeLists.txt"; exit 1; }
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh dist/Anabasis-macOS "$VERSION" "dist/Anabasis-${VERSION}-macOS.pkg"

      - name: Upload macOS installer
        if: ${{ !cancelled() && steps.package_macos.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-macOS-installer
          path: dist/Anabasis-*-macOS.pkg
          if-no-files-found: error

      - name: Upload macOS plugins (VST3 + AU + Standalone)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-macOS
          path: dist/Anabasis-macOS
          if-no-files-found: error

      # Uploaded only when at least one VALIDATED dSYM was captured: with zero
      # usable dSYMs the upload is skipped -- with a warning already emitted by
      # the package step -- instead of failing on an empty directory.
      - name: Upload macOS debug symbols (dSYMs, crash symbolication)
        if: ${{ !cancelled() && steps.package.outcome != 'skipped' && steps.package.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anabasis-macOS-debug
          path: dist/Anabasis-macOS-debug
          if-no-files-found: error

      # HALF TWO OF THE SYMBOLICATION CONTRACT (0.2.0), and the reason it is a
      # separate step LAST rather than an `exit 1` inside the packaging block:
      # a debug-capture finding must not withhold customer artifacts whose
      # behavioural gates all passed. They are built, validated and uploaded
      # above; this still fails the job.
      #
      # `debug_artifacts` is written by the packaging step only when at least
      # one dSYM survived every validity test -- DWARF payload present, UUID set
      # matching the binary's slices exactly, and, since 0.2.5, at least one
      # DWARF compile unit **per architecture slice** rather than one across the
      # fat file. That last distinction is what this assertion had been unable
      # to see: a dSYM with 39 x86_64 units and 0 arm64 units cleared the old
      # aggregate test, so the run reported a captured dSYM while every arm64
      # crash log stayed unsymbolicatable (ADR-0035). So this reads a verdict
      # rather than re-deriving one -- but the verdict now means what it says.
      - name: Assert a validated dSYM was captured
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.package.outputs.debug_artifacts }}" != "true" ]; then
            echo "::error::no usable dSYM was produced. Since -Wl,-object_path_lto landed this is a REGRESSION, not the expected Release+LTO outcome: ld64 keeps the LTO object dsymutil needs, and the 'Assert LTO ran' step earlier in this job confirmed it did. Check that flag and the retained-object directory. Do NOT resolve this by disabling LTO, and do NOT relax this assertion -- the customer artifacts for this run were built, validated and uploaded before this step ran."
            exit 1
          fi
          echo "a UUID-matched dSYM with compile units was captured and uploaded"

  # ==========================================================================
  #  NATIVE INTEL macOS — the one execution environment nothing else covers.
  #
  #  RESTORED, and the reason it was briefly removed is worth recording. It was
  #  added during the KI-009 hunt on the theory that the fault was
  #  architecture-specific; the fault turned out to be compiler-specific
  #  (INC-004), so the theory died and the job was dropped with it. That was the
  #  wrong conclusion from a right observation: the job's VALUE was never the
  #  hypothesis. It is that the `macos` job builds a UNIVERSAL binary and then
  #  executes its x86_64 slice only under Rosetta 2 — which translates x86_64 to
  #  arm64 and runs on arm64 hardware, with FPCR rather than MXCSR and NEON
  #  rather than SSE. Half the macOS user base therefore had compile-only
  #  coverage. That gap is real whatever KI-009 turned out to be, and this job is
  #  the only thing that closes it.
  #
  #  It is deliberately SMALLER than the version that was removed: the
  #  stage-trace diagnostic build is gone (13 of that job's 31 minutes, and it
  #  existed to LOCATE a fault that is now located — ANABASIS_STAGE_TRACE
  #  remains available for the next one). No packaging, signing or upload: the
  #  shipping artefact still comes from the universal build above.
  # ==========================================================================
  macos-intel:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-15-intel   # NATIVE x86_64 hardware -- not Apple Silicon, not Rosetta
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FAIL, do not warn. A job whose entire purpose is "run on Intel" is
      # worthless if it quietly runs somewhere else, and a green tick from the
      # wrong architecture is worse than no job at all: it would be read as
      # "Intel is fine". `sysctl.proc_translated` is 1 inside Rosetta and 0 or
      # absent on a real Intel machine, so both wrong answers are caught.
      - name: Assert this really is native Intel
        run: |
          set -e
          ARCH="$(uname -m)"
          TRANSLATED="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          echo "uname -m = $ARCH ; sysctl.proc_translated = $TRANSLATED"
          sysctl -n machdep.cpu.brand_string || true
          if [ "$ARCH" != "x86_64" ]; then
            echo "::error::this job must run on native x86_64 (got $ARCH) -- the coverage it exists for cannot be produced here"
            exit 1
          fi
          if [ "$TRANSLATED" != "0" ]; then
            echo "::error::running under Rosetta translation -- that is the coverage this job exists to replace"
            exit 1
          fi

      # A BARE `brew install ... || true` SWALLOWS A GENUINE FAILURE, so each tool
      # is followed by the check that proves it is usable. ninja is preinstalled
      # on this image, which is what makes `|| true` safe for it; ccache is not,
      # and it is an OPTIMIZATION rather than a requirement -- so a brew hiccup
      # publishes an empty launcher and the job builds slower, never differently.
      - name: Install build tools
        run: |
          brew install ninja || true
          ninja --version
          cmake --version | head -1
          if brew install ccache && ccache --version; then
            echo "ANABASIS_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache unavailable -- building without the compiler cache"
            echo "ANABASIS_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          fi

      # Its own lineage: this job compiles a THIN x86_64 tree and the universal
      # job compiles both slices, so the two share no entries by construction
      # (the `-arch` list is in ccache's hash) and a shared key would only make
      # them evict each other. See the universal job for why macOS is cached.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-intel-${{ github.run_id }}
          restore-keys: ccache-macos-intel-

      # THIN x86_64, not universal. The universal build is the shipping
      # configuration and is already covered; here the point is that every
      # object is produced by the Intel code generator and executed by an Intel
      # CPU, with no arm64 slice present to be picked instead.
      - name: Configure (native x86_64 only)
        run: >
          ccache --zero-stats || true &&
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANABASIS_COMPILER_LAUNCHER }}
          -DANABASIS_BUILD_PROBE=ON
          -DANABASIS_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + AU + Standalone + tests + probe)
        id: build
        run: cmake --build build --config Release

      # THE SINGLE-ARCH CONTROL, and the reason this step exists at all. When a
      # review asked whether ccache really caches the UNIVERSAL build -- older
      # ccache declined compilations carrying more than one `-arch` -- the
      # natural way to answer it was to compare `macos` against this job, which
      # differs from it in exactly one variable: one architecture instead of
      # two. That comparison could not be made, because this job restored a
      # cache and then never said what the cache did. A cache whose hit rate is
      # unobservable cannot be defended OR retired on evidence, which is the
      # same "a gate that cannot fail is indistinguishable from one that passes"
      # failure the lint self-tests exist to prevent -- here applied to a
      # measurement rather than a gate. Read-only and `|| true`: it reports, it
      # cannot fail the job. (`sanitizers` and `realtime` have the same gap and
      # are deliberately left alone in this round -- they are Linux jobs and
      # outside the macOS question this step was added to answer.)
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANABASIS_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      - name: Self-tests (DSP + state), native Intel
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-tests.sh

      - name: Engine reproduction (no wrapper, no format, no host)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./build/AnabasisEngineRepro_artefacts/Release/AnabasisEngineRepro

      - name: Install the AU so the AudioComponent registry can find it
        id: au_install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DEST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DEST"
          rm -rf "$DEST/Anabasis.component"
          cp -R build/Anabasis_artefacts/Release/AU/Anabasis.component "$DEST/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "bundle=$DEST/Anabasis.component" >> "$GITHUB_OUTPUT"

      # Both formats, because the field report named both and because this is
      # the shipped code path -- host -> wrapper -> processBlock -> engine --
      # built by the Intel back end and run on an Intel CPU.
      # Split for the same reason as the universal job's pair above: an AU
      # install failure must not suppress a VST3 result that was ready to run.
      - name: Channel probe, native Intel -- VST3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          ./build/AnabasisChannelProbe_artefacts/Release/AnabasisChannelProbe \
            build/Anabasis_artefacts/Release/VST3/Anabasis.vst3 --format vst3

      - name: Channel probe, native Intel -- AU
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.au_install.outcome == 'success' }}
        run: |
          set -e
          ./build/AnabasisChannelProbe_artefacts/Release/AnabasisChannelProbe \
            "$HOME/Library/Audio/Plug-Ins/Components/Anabasis.component" --format au

      - name: pluginval VST3 (deterministic x3), native Intel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic vst3

      - name: pluginval AU (deterministic x3), native Intel
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.au_install.outcome == 'success' }}
        env:
          ANABASIS_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANABASIS_PLUGINVAL_STRICTNESS }} deterministic au
